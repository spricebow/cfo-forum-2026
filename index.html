function renderTechStack() {
  var NV='#0B0C44',TL='#006C80',EM='#118B80',SP='#8B7495',PL='#E4DEE0',OW='#F1EFF0';
  var layers = [
    { label:'ERP — single source of truth', color:NV, tools:['NetSuite','Sage Intacct','Microsoft Business Central','SAP B1'] },
    { label:'FP&A — planning & forecasting', color:TL, tools:['Pigment','Mosaic','Adaptive Planning','Jedox'] },
    { label:'Close management', color:SP, tools:['FloQast','BlackLine','Trintech'] },
    { label:'BI & dashboards', color:EM, tools:['Power BI','Tableau','Qlik','Lightdash'] },
    { label:'Integration layer', color:'#465576', tools:['Fivetran','dbt','Azure Data Factory','Zapier'] },
  ];
  var colW = 110, colGap = 8, rowH = 56, rowGap = 6, leftW = 160, leftGap = 10;
  var maxTools = Math.max.apply(null, layers.map(function(l){return l.tools.length;}));
  var totalW = leftW + leftGap + maxTools*(colW+colGap) - colGap + 20;
  var totalH = layers.length*(rowH+rowGap) - rowGap + 20;

  var svg = '<svg viewBox="0 0 '+totalW+' '+totalH+'" style="width:100%;height:auto;display:block;font-family:Arial,sans-serif">';
  layers.forEach(function(layer, li) {
    var y = 10 + li*(rowH+rowGap);
    // Layer label
    svg += '<rect x="0" y="'+y+'" width="'+leftW+'" height="'+rowH+'" rx="3" fill="'+layer.color+'"/>';
    var words = layer.label.split(' '), line1='', line2='';
    words.forEach(function(w){ if((line1+' '+w).trim().length<=20) line1=(line1+' '+w).trim(); else line2=(line2+' '+w).trim(); });
    svg += '<text x="'+leftW/2+'" y="'+(y+rowH/2-(line2?7:0))+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">'+line1+'</text>';
    if(line2) svg += '<text x="'+leftW/2+'" y="'+(y+rowH/2+9)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">'+line2+'</text>';
    // Tool chips
    layer.tools.forEach(function(tool, ti) {
      var x = leftW + leftGap + ti*(colW+colGap);
      svg += '<rect x="'+x+'" y="'+y+'" width="'+colW+'" height="'+rowH+'" rx="3" fill="'+layer.color+'18" stroke="'+layer.color+'40" stroke-width="1.5"/>';
      svg += '<text x="'+(x+colW/2)+'" y="'+(y+rowH/2+4)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="'+layer.color+'">'+tool+'</text>';
    });
  });
  svg += '</svg>';

  return '<div class="slide-section-label">PE finance tech stack — layers</div>'
    + '<div style="margin-bottom:8px;font-size:11.5px;color:var(--slate)">Best-in-class is a fully integrated stack. Each layer feeds the one above it. Most Lagging businesses have ERP but nothing above it.</div>'
    + svg;
}

function renderFacilitatorWithData(sh, responses) {
  var n = responses.length;
  var TOTAL_SLIDES = 13;

  // ── Group stats ───────────────────────────────────────────────────────────
  var dimAvgBand = DIMS.map(function(_,d){
    var vs=responses.map(function(r){return r.scores[d];}).filter(function(v){return v!=null;});
    return vs.length?(vs.reduce(function(a,b){return a+b;},0)/vs.length):0;
  });
  var dists = DIMS.map(function(_,d){
    var c=[0,0,0,0];
    responses.forEach(function(r){var v=r.scores[d];if(v!=null)c[v]++;});
    return c;
  });
  var weakIdx   = dimAvgBand.indexOf(Math.min.apply(null,dimAvgBand));
  var strongIdx = dimAvgBand.indexOf(Math.max.apply(null,dimAvgBand));
  var overallBand = Math.round(dimAvgBand.reduce(function(a,b){return a+b;},0)/9);
  var groupBands = DIMS.map(function(_,d){
    var vs=responses.map(function(r){return r.scores[d];}).filter(function(v){return v!=null;});
    return vs.length?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length):null;
  });

  // Slide map:
  // 0  = Overview
  // 1  = Capability heat map
  // 2-10 = Dimensions 0-8
  // 11 = Action plan
  // 12 = Profiles + prompts
  var slideLabels = ['Overview','Capabilities'];
  DIMS.forEach(function(d){ slideLabels.push(d.short); });
  slideLabels.push('Action Plan','Profiles');

  // ── Toolbar ───────────────────────────────────────────────────────────────
  var toolbar = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
    + '<div class="section-title">Facilitator Dashboard</div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
    + '<span style="font-size:11px;color:var(--slate);padding:4px 8px;background:var(--ow);border:1px solid var(--pearl);border-radius:2px">'+n+' response'+(n!==1?'s':'')+' &nbsp;&middot;&nbsp; <strong style="color:'+BAND_COLORS[overallBand]+'">'+BAND_NAMES[overallBand]+'</strong></span>'
    + '<button class="btn" onclick="renderFacilitator()" style="font-size:11px;padding:6px 12px">&#8635;</button>'
    + (sponsorView.some(function(v){ return v!==null&&!isNaN(parseFloat(v)); })
        ? '<button class="btn" onclick="toggleSponsor()" style="font-size:11px;padding:6px 12px;'
          + (showSponsor ? 'background:#FF6661;color:#fff;border-color:#FF6661' : 'color:#FF6661;border-color:#FF6661')
          + '">' + (showSponsor ? '&#9670; Hide sponsor' : '&#9670; Show sponsor') + '</button>'
        : '')
    + '<button class="btn" onclick="showQR()" style="font-size:11px;padding:6px 12px;background:var(--teal);color:#fff;border-color:var(--teal)">QR</button>'
    + '<button class="btn" onclick="exportToExcel()" style="font-size:11px;padding:6px 12px;background:var(--emerald);color:#fff;border-color:var(--emerald)">&#8595; Excel</button>'
    + '<button class="btn" onclick="if(confirm(\'Clear all responses?\')){clearResponses().then(function(){renderFacilitator();});}" style="font-size:11px;padding:6px 12px;color:#C0392B;border-color:#C0392B">Clear</button>'
    + '</div></div>'
    + '<div class="section-rule"></div>';

  // ── Nav bar ───────────────────────────────────────────────────────────────
  function makeNav() {
    var dots = slideLabels.map(function(l,i){
      var cls = i===facSlide?'active':i<facSlide?'done':'';
      return '<button class="slide-dot '+cls+'" title="'+l+'" onclick="goSlide('+i+')" style="width:'+(i===0||i===1||i===11||i===12?'10':'8')+'px;height:'+(i===0||i===1||i===11||i===12?'10':'8')+'px"></button>';
    }).join('');
    return '<div class="slide-nav-bar">'
      + '<button class="slide-btn" onclick="goSlide('+(facSlide-1)+')" '+(facSlide===0?'disabled':'')+'>&#8592; Prev</button>'
      + '<div style="flex:1;text-align:center">'
      + '<div class="slide-dots" style="margin-bottom:4px">'+dots+'</div>'
      + '<div class="slide-counter"><strong>'+slideLabels[facSlide]+'</strong> &nbsp;&middot;&nbsp; '+(facSlide+1)+' / '+TOTAL_SLIDES+'</div>'
      + '</div>'
      + '<button class="slide-btn primary" onclick="goSlide('+(facSlide+1)+')" '+(facSlide===TOTAL_SLIDES-1?'disabled':'')+'>Next &#8594;</button>'
      + '</div>';
  }

  function wrap(inner) {
    return '<div class="card slide-shell">' + toolbar + makeNav() + inner + '</div>';
  }

  // ── No responses ──────────────────────────────────────────────────────────
  if (!n) {
    sh.innerHTML = wrap('<div class="empty-state"><div style="font-size:32px;margin-bottom:10px">&#128202;</div>'
      + '<div>No responses yet.</div>'
      + '<div style="font-size:12px;margin-top:6px">Ask participants to complete and click Submit to group.</div>'
      + '<div style="margin-top:12px"><button class="btn" onclick="renderFacilitator()">&#8635; Refresh</button></div></div>');
    return;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SLIDE 0: Overview
  // ══════════════════════════════════════════════════════════════════════════
  if (facSlide === 0) {
    var radarSvg = drawRadar(groupBands, 260, '#006C80');
    // Also draw sponsor radar overlay if data exists
    var hasSponsor = showSponsor && sponsorView.some(function(v){ return v !== null && v !== undefined && !isNaN(parseFloat(v)); });
    if (hasSponsor) {
      var sponsorBands = sponsorView.map(function(v){ return v !== null && !isNaN(parseFloat(v)) ? parseFloat(v) : null; });
      var sponsorRadar = drawRadar(sponsorBands, 260, '#FF6661');
      // Overlay: extract the polygon path from the sponsor radar and inject into the group radar
      // Extract the data polygon from sponsorRadar (has fill-opacity=".15")
      var sponsorPolyMatch = sponsorRadar.match(/<polygon points="[^"]*" fill="#FF6661" fill-opacity="\.15" stroke="#FF6661" stroke-width="2\.5"\/>/);
      if (sponsorPolyMatch) {
        var sponsorPoly = sponsorPolyMatch[0]
          .replace('fill="#FF6661" fill-opacity=".15"', 'fill="rgba(255,102,97,0.25)"')
          .replace('stroke-width="2.5"', 'stroke-width="2" stroke-dasharray="4,3"');
        // Also extract sponsor dots
        var sponsorDots = sponsorRadar.match(/<circle[^>]*fill="#FF6661"[^>]*\/>/g) || [];
        radarSvg = radarSvg.replace('</svg>', sponsorPoly + sponsorDots.join('') + '</svg>');
      }
    }
    var dimGrid = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">'
      + DIMS.map(function(d,i){
          var v=groupBands[i], c=v!=null?BAND_COLORS[v]:'#ccc';
          var sv2 = showSponsor ? sponsorView[i] : null;
          var svLabel = (sv2 !== null && sv2 !== undefined && !isNaN(parseFloat(sv2)))
            ? '<div style="font-size:9px;color:#FF6661;font-weight:700;margin-top:2px">&#9670; Sponsor: '+(parseFloat(sv2)+1).toFixed(1)+'</div>'
            : '';
          return '<div style="background:var(--bm-offwhite);border:1px solid var(--bm-warmgrey);border-radius:2px;padding:7px 9px;border-left:3px solid '+c+'">'
            +'<div style="font-size:9px;color:var(--bm-lilacgrey);margin-bottom:2px">'+d.short+'</div>'
            +'<div style="font-size:11px;font-weight:700;color:'+c+'">'+(v!=null?BAND_NAMES[v]:'—')+'</div>'
            +svLabel
            +'</div>';
        }).join('')
      + '</div>';
    sh.innerHTML = wrap(
      '<div style="display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start">'
      + '<div><div class="slide-section-label">Group radar</div>'+radarSvg
      + '<div style="text-align:center;margin-top:8px">'
      + '<div style="font-size:11px;color:var(--slate)">Overall</div>'
      + '<div style="font-size:22px;font-weight:700;color:'+BAND_COLORS[overallBand]+'">'+BAND_NAMES[overallBand]+'</div>'
      + '</div></div>'
      + '<div><div class="slide-section-label">Dimension summary</div>'+dimGrid+renderFoundations(groupBands)+'</div>'
      + '</div>'
    );
    return;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SLIDE 1: Capability heat map
  // ══════════════════════════════════════════════════════════════════════════
  if (facSlide === 1) {
    sh.innerHTML = wrap(
      '<div class="slide-section-label">Group capability heat map</div>'
      + '<div style="font-size:12px;color:var(--slate);margin-bottom:10px">M = monthly &nbsp;&middot;&nbsp; A = ad-hoc &nbsp;&middot;&nbsp; No = cannot produce &nbsp;&middot;&nbsp; % = weighted maturity score</div>'
      + renderGroupHeatmap(responses)
    );
    return;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SLIDES 2-10: One slide per dimension
  // ══════════════════════════════════════════════════════════════════════════
  if (facSlide >= 2 && facSlide <= 10) {
    var di = facSlide - 2;
    var counts = dists[di];
    var total = counts.reduce(function(a,b){return a+b;},0);
    var avg = dimAvgBand[di];
    var modal = Math.round(avg);
    var ac = BAND_COLORS[modal];

    // Bar chart
    var rawMax=Math.max.apply(null,counts)||1, yMax=rawMax+1;
    var chartH=90,leftPad=22,topPad=10,botPad=24,barW=44,gap=14;
    var innerW=4*(barW+gap)-gap, totalW=leftPad+innerW+8, totalH=topPad+chartH+botPad;
    var gridLines='';
    for(var gi=0;gi<=yMax;gi++){
      var gy=topPad+chartH-Math.round((gi/yMax)*chartH);
      gridLines+='<line x1="'+(leftPad-4)+'" y1="'+gy+'" x2="'+(leftPad+innerW+4)+'" y2="'+gy+'" stroke="#E4DEE0" stroke-width="1"/>'
        +'<text x="'+(leftPad-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#9192AB" font-family="Arial,sans-serif">'+gi+'</text>';
    }
    var svgBars=counts.map(function(c,j){
      var bH=c>0?Math.max(4,Math.round((c/yMax)*chartH)):0;
      var bx=leftPad+j*(barW+gap), by=topPad+chartH-bH;
      return(bH>0?'<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bH+'" rx="2" fill="'+BAND_COLORS[j]+'"/>':'')
        +(c>0?'<text x="'+(bx+barW/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0C44" font-family="Arial,sans-serif">'+c+'</text>':'')
        +'<text x="'+(bx+barW/2)+'" y="'+(topPad+chartH+16)+'" text-anchor="middle" font-size="9" fill="#9192AB" font-family="Arial,sans-serif">'+BAND_SHORT[j]+'</text>';
    }).join('');
    // Sponsor overlay — coral diamond at decimal position
    var sponsorOverlay = '';
    var sv = showSponsor ? sponsorView[di] : null;
    if (sv !== null && sv !== undefined && !isNaN(parseFloat(sv))) {
      var svf = parseFloat(sv);
      // x position: map 0-3 range to bar centres
      // each band occupies barW+gap pixels; centre of band j = leftPad + j*(barW+gap) + barW/2
      // for decimal value, interpolate between band centres
      var svFloor = Math.floor(Math.max(0, Math.min(2.99, svf)));
      var svFrac  = svf - svFloor;
      var xLeft   = leftPad + svFloor*(barW+gap) + barW/2;
      var xRight  = leftPad + (svFloor+1)*(barW+gap) + barW/2;
      var svX     = svf <= 0 ? leftPad + barW/2
                  : svf >= 3 ? leftPad + 3*(barW+gap) + barW/2
                  : xLeft + svFrac*(xRight-xLeft);
      var dSize = 7;
      var dy    = topPad + chartH + 6;
      // Vertical dotted guide line
      sponsorOverlay = '<line x1="'+svX+'" y1="'+topPad+'" x2="'+svX+'" y2="'+(topPad+chartH)+'" stroke="#FF6661" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>'
        // Diamond marker on baseline
        +'<polygon points="'+svX+','+(dy)+' '+(svX+dSize)+','+(dy+dSize)+' '+svX+','+(dy+dSize*2)+' '+(svX-dSize)+','+(dy+dSize)+'" fill="#FF6661" opacity="0.9"/>'
        // Label
        +'<text x="'+svX+'" y="'+(dy+dSize*2+11)+'" text-anchor="middle" font-size="8" font-weight="700" fill="#FF6661" font-family="Arial,sans-serif">Sponsor: '+(svf+1).toFixed(1)+'</text>';
    }

    var chartSvg='<svg viewBox="0 0 '+totalW+' '+(totalH+(sv!==null&&sv!==undefined?22:0))+'" style="width:100%;height:auto;display:block">'
      +'<line x1="'+(leftPad-4)+'" y1="'+topPad+'" x2="'+(leftPad-4)+'" y2="'+(topPad+chartH)+'" stroke="#E4DEE0" stroke-width="1"/>'
      +'<line x1="'+(leftPad-4)+'" y1="'+(topPad+chartH)+'" x2="'+(leftPad+innerW+4)+'" y2="'+(topPad+chartH)+'" stroke="#E4DEE0" stroke-width="1"/>'
      +gridLines+svgBars+sponsorOverlay+'</svg>';

    // Snapshot
    var pct=function(v){return total>0?Math.round(v/total*100):0;};
    var lagEm=counts[0]+counts[1],eff=counts[2],bic=counts[3];
    var interp=avg>=2.5?'Group broadly at PE-standard.':avg>=1.5?'Functional — targeted investment needed.':'Significant gaps — urgent prioritisation required.';
    var snapshot='<div style="background:var(--ow);border:1px solid var(--pearl);border-radius:2px;padding:12px 14px">'
      +'<div style="font-size:22px;font-weight:700;color:'+ac+';margin-bottom:2px">'+BAND_NAMES[modal]+'</div>'
      +'<div style="font-size:11px;color:var(--slate);margin-bottom:10px">'+total+' responses &nbsp;&middot;&nbsp; modal band</div>'
      +[['Lagging\u2013Emerging',lagEm,BAND_COLORS[0]],['Effective',eff,BAND_COLORS[2]],['Best-in-Class',bic,BAND_COLORS[3]]].map(function(b){
          return '<div style="margin-bottom:7px">'
            +'<div style="display:flex;justify-content:space-between;margin-bottom:2px">'
            +'<span style="font-size:11px;color:var(--steel)">'+b[0]+'</span>'
            +'<span style="font-size:11px;font-weight:700;color:'+b[2]+'">'+b[1]+' ('+pct(b[1])+'%)</span>'
            +'</div><div style="height:5px;background:var(--pearl);border-radius:2px;overflow:hidden">'
            +'<div style="height:100%;width:'+pct(b[1])+'%;background:'+b[2]+';border-radius:2px"></div></div></div>';
        }).join('')
      +'<div style="font-size:11.5px;color:var(--steel);font-style:italic;padding-top:8px;border-top:1px solid var(--pearl)">'+interp+'</div>'
      +'</div>';

    // KPI benchmarks
    var kpiData=BENCHMARKS_KPI.find(function(b){return b.dim===DIMS[di].label;});
    var kpiHtml=kpiData?'<div class="slide-section-label">KPI benchmarks</div>'
      +'<table class="benchmark-table"><thead><tr><th>KPI</th><th>Effective</th><th>Best-in-Class</th></tr></thead><tbody>'
      +kpiData.kpis.map(function(k){return'<tr><td class="bm-kpi">'+k.kpi+'</td><td class="bm-eff">'+k.eff+'</td><td class="bm-bic">'+k.bic+'</td></tr>';}).join('')
      +'</tbody></table>':'';

    // Red flags
    var rf=RED_FLAGS.find(function(r){return r.dim===di;});
    var rfHtml=rf?'<div class="slide-section-label">Red flags</div>'
      +'<div style="background:#C0392B08;border:1px solid #C0392B28;border-radius:2px;padding:10px 12px">'
      +rf.flags.map(function(f){
          return '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:5px">'
            +'<div style="color:#C0392B;font-size:12px;flex-shrink:0">\u26a0</div>'
            +'<div style="font-size:11.5px;color:var(--steel);line-height:1.4">'+f+'</div></div>';
        }).join('')
      +'</div>':'';

    // Diagnostic questions
    var dq=DIAG_QUESTIONS.find(function(d){return d.dim===di;});
    var dqHtml=dq?'<div class="slide-section-label">Diagnostic questions</div>'
      +'<div style="display:flex;flex-direction:column;gap:5px">'
      +dq.questions.map(function(q,qi){
          return '<div style="display:flex;gap:9px;align-items:flex-start;padding:7px 10px;background:var(--ow);border:1px solid var(--pearl);border-radius:2px">'
            +'<div style="width:18px;height:18px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--aqua);flex-shrink:0">'+(qi+1)+'</div>'
            +'<div style="font-size:11.5px;color:var(--steel);line-height:1.45">'+q+'</div></div>';
        }).join('')
      +'</div>':'';

    // Priority action
    var ta=TOP_ACTIONS.find(function(a){return a.dim===di;});
    var bkey=avg<1?'lag':avg<2?'emg':avg<2.7?'eff':'bic';
    var actionHtml=ta?'<div class="slide-section-label">Priority action</div>'
      +'<div class="action-slide-item" style="border-left-color:'+ac+'">'
      +'<div style="font-size:9px;font-weight:700;color:'+ac+';text-transform:uppercase;width:70px;flex-shrink:0">'+DIMS[di].short+'</div>'
      +'<div style="font-size:12.5px;color:var(--steel);line-height:1.5">'+ta[bkey]+'</div>'
      +'</div>':'';

    // Collapsible extra detail
    var extraId = 'extra-detail-'+di;
    var hs=HOLD_STAGE.find(function(h){return h.dim===di;});
    var hsHtml=hs?'<div class="slide-section-label">Target band by hold stage</div>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'
      +hs.stages.map(function(st){
          var stageColors={'Lag/Em':'#C0392B','Emerging':'#88395A','Effective':'#006C80','BIC':'#118B80'};
          var c=stageColors[st.t]||'#465576';
          return '<div style="border-radius:2px;padding:8px 10px;background:'+c+'10;border:1px solid '+c+'30">'
            +'<div style="font-size:9px;font-weight:700;color:var(--slate);margin-bottom:3px">'+st.s+'</div>'
            +'<div style="font-size:11px;font-weight:700;color:'+c+';margin-bottom:2px">'+st.t+'</div>'
            +'<div style="font-size:10px;color:var(--steel);line-height:1.3">'+st.n+'</div>'
            +'</div>';
        }).join('')
      +'</div>':'';

    var bc=BENCHMARK_CALLOUTS.find(function(b){return b.dim===di;});
    var bcHtml=bc?'<div class="slide-section-label">Benchmark spotlight</div>'
      +'<div style="background:var(--navy);border-radius:2px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start">'
      +'<div style="text-align:center;padding:7px 12px;background:rgba(255,255,255,0.08);border-radius:2px;min-width:90px">'
      +'<div style="font-size:9px;color:#9192AB;margin-bottom:3px;text-transform:uppercase">'+bc.stat+'</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--teal)">EFF: '+bc.eff+'</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--aqua)">BIC: '+bc.bic+'</div>'
      +'</div>'
      +'<div style="font-size:11.5px;color:#C8CAD8;line-height:1.5">'+bc.insight+'</div>'
      +'</div>':'';

    var fpExtra='';
    var fp=FAILURE_PATTERNS.find(function(f){return f.dim===di;});
    if(fp){
      var bkeys=['lag','emg','eff','bic'],bnames=['Lagging','Emerging','Effective','Best-in-Class'];
      var ftabs=bkeys.map(function(bk,bi){
        var act=bi===modal?' act-'+bkeys[bi]:'';
        return'<button class="slide-ftab'+act+'" onclick="slideFPTab('+di+','+bi+')">' +bnames[bi]+'</button>';
      }).join('');
      var fbodies=bkeys.map(function(bk,bi){
        return'<div class="slide-fbody'+(bi===modal?' open':'')+'" id="sfp-'+di+'-'+bi+'">'+fp.patterns[bk]+'</div>';
      }).join('');
      fpExtra='<div class="slide-section-label">Failure patterns</div>'
        +'<div class="slide-failure-tabs">'+ftabs+'</div>'+fbodies;
    }

    var orgExtra = renderOrgChartForDim(di);

    // Capability snapshot for relevant dims — shown directly in right column
    var capSnapHtml = '';
    var caps = capsByDim(di);
    if (caps.length && responses.length) {
      var hasCaps2 = responses.some(function(r){ return r.capabilities && Object.keys(r.capabilities).length > 0; });
      if (hasCaps2) {
        var pHeaders2 = responses.map(function(r){ return '<th style="text-align:center;font-size:9px;padding:4px 3px;background:var(--bm-blue);color:#fff;white-space:nowrap">P'+r.id+'</th>'; }).join('');
        var capRows2 = caps.map(function(cap) {
          var cells2 = responses.map(function(r) {
            var v = r.capabilities && r.capabilities[cap.id];
            if (v==='monthly') return '<td class="hm-monthly">M</td>';
            if (v==='adhoc')   return '<td class="hm-adhoc">A</td>';
            if (v==='no')      return '<td class="hm-no">No</td>';
            if (v==='na')      return '<td style="text-align:center;font-size:9px;color:#9192AB;font-weight:600">N/A</td>';
            return '<td style="text-align:center;color:#ccc;font-size:9px">—</td>';
          }).join('');
          var att2 = responses.filter(function(r){ return r.capabilities && capAnswered(r.capabilities[cap.id]); });
          var score2 = att2.reduce(function(a,r){ var s=capScore(r.capabilities[cap.id]); return a+(s!==null?s:0); },0);
          var pct2 = att2.length ? Math.round(score2/(att2.length*2)*100) : null;
          var pc2 = pct2===null?'#ccc':pct2>=70?'#118B80':pct2>=40?'#8B7495':'#C0392B';
          return '<tr><td class="hm-label">'+cap.label+'</td>'+cells2+'<td style="text-align:center;font-weight:700;font-size:10px;color:'+pc2+'">'+(pct2===null?'—':pct2+'%')+'</td></tr>';
        }).join('');
        capSnapHtml = '<div class="slide-section-label">Capability snapshot</div>'
          + '<div class="heatmap-wrap"><table class="heatmap"><thead><tr>'
          + '<th style="background:var(--bm-blue);color:#fff;font-size:10px;padding:5px 8px">Capability</th>'
          + pHeaders2
          + '<th style="text-align:center;background:var(--teal);color:#fff;font-size:9px;padding:4px 6px;white-space:nowrap">Score</th>'
          + '</tr></thead><tbody>'+capRows2+'</tbody></table></div>';
      }
    }

    var enrichExtra = renderDimEnrichment(di, modal, responses);
    // Remove the capability section from enrichExtra (it's now in the right col)
    // enrichExtra already excludes caps since capSnapHtml is built separately above

    var extraContent = hsHtml + bcHtml + fpExtra + orgExtra;

    var collapseHtml = '<div style="margin-top:14px;border-top:1px solid var(--pearl);padding-top:10px">'
      + '<button onclick="var el=document.getElementById(\''+extraId+'\');var btn=this;if(el.style.display===\'none\'){el.style.display=\'block\';btn.textContent=\'&#9650; Less detail\';}else{el.style.display=\'none\';btn.textContent=\'&#9660; More detail\';}" '
      + 'style="font-size:11px;font-weight:700;color:var(--teal);background:none;border:none;cursor:pointer;font-family:inherit;padding:0">&#9660; More detail</button>'
      + '<div id="'+extraId+'" style="display:none;margin-top:10px">'+extraContent+'</div>'
      + '</div>';

    // Dim header
    var dimHeader = '<div style="background:var(--navy);border-radius:2px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px">'
      +'<div class="slide-dim-badge" style="width:30px;height:30px;font-size:13px">'+(di+1)+'</div>'
      +'<div><div style="font-size:16px;font-weight:700;color:#fff">'+DIMS[di].label+'</div>'
      +'<div style="font-size:10px;color:var(--slate)">'+DIMS[di].compass+' &nbsp;&middot;&nbsp; <span style="color:'+BAND_COLORS[modal]+'">Group modal: '+BAND_NAMES[modal]+'</span></div>'
      +'</div></div>';

    // Two-column layout:
    // Left  = chart + snapshot + KPI benchmarks + action
    // Right = red flags + diagnostic questions + capability snapshot + more detail
    var leftCol = '<div style="display:flex;flex-direction:column;gap:12px">'
      + '<div class="slide-two-col" style="gap:12px">'
      + '<div>'+chartSvg+'</div>'
      + '<div>'+snapshot+'</div>'
      + '</div>'
      + kpiHtml
      + actionHtml
      + '</div>';

    var rightCol = '<div style="display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:calc(100vh - 240px);padding-right:4px">'
      + capSnapHtml
      + rfHtml
      + dqHtml
      + collapseHtml
      + '</div>';

    sh.innerHTML = wrap(
      dimHeader
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">'
      + leftCol
      + rightCol
      + '</div>'
    );
    return;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SLIDE 11: Action plan
  // ══════════════════════════════════════════════════════════════════════════
  if (facSlide === 11) {
    sh.innerHTML = wrap(renderConsolidatedNextSteps(responses, dimAvgBand));
    return;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SLIDE 12: Profiles + discussion prompts
  // ══════════════════════════════════════════════════════════════════════════
  var lagCount=dists[weakIdx][0]+dists[weakIdx][1];
  var spread=dists[weakIdx].filter(function(c){return c>0;}).length>2;
  var prompts=[
    '<strong>'+DIMS[weakIdx].label+'</strong> is the group weakest dimension'+(lagCount>0?' \u2014 '+lagCount+' participant'+(lagCount>1?'s':'')+' rated Lagging or Emerging.':'. ')+' What is the single biggest structural barrier?',
    spread?'Wide spread on <strong>'+DIMS[weakIdx].label+'</strong>. What explains the gap between Effective/BIC and Lagging/Emerging?':'<strong>'+DIMS[strongIdx].label+'</strong> is the group strongest area. Is that sustainable through a buy-and-build or pre-exit period?',
    'Cash &amp; Working Capital \u2014 how many are running cash as a strategic lever vs. just reporting it?',
    'Business Partnering \u2014 is finance in the room when commercial decisions are made, or does it find out afterwards?',
    'Data Quality \u2014 does the same KPI mean the same thing in finance and in the business?',
    'If you had to move one dimension from Lagging/Emerging to Effective in 90 days \u2014 which would it be and what is the first action?',
    'Is the biggest weakness structural (People, Process) or operational (Technology, Data)?',
  ];
  var profileHtml=responses.map(function(r){
    var vs=r.scores, validVs=vs.filter(function(v){return v!=null;});
    var avgB=validVs.length?Math.round(validVs.reduce(function(a,b){return a+b;},0)/validVs.length):0;
    return'<div class="profile-card"><div class="profile-id">P'+r.id+'</div>'
      +DIMS.map(function(d,di){var v=vs[di];return'<div class="profile-row"><div class="profile-dim" title="'+d.label+'">'+d.short+'</div><div class="profile-bar-track"><div class="profile-bar-fill" style="width:'+(v==null?0:(v+1)/4*100)+'%;background:'+bandColor(v)+'"></div></div><div class="profile-band" style="color:'+bandColor(v)+'">'+(v==null?'\u2014':BAND_SHORT[v])+'</div></div>';}).join('')
      +'<div class="profile-avg" style="color:'+BAND_COLORS[avgB]+'">'+BAND_NAMES[avgB]+'</div></div>';
  }).join('');

  sh.innerHTML = wrap(
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    +'<div><div class="slide-section-label">Individual profiles (anonymised)</div>'
    +'<div class="profiles-grid">'+profileHtml+'</div></div>'
    +'<div><div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">Discussion prompts</div>'
    +prompts.map(function(p,i){return'<div class="prompt-row"><div class="prompt-num">'+(i+1)+'</div><div class="prompt-text">'+p+'</div></div>';}).join('')
    +'<div style="margin-top:12px"><button class="print-btn" onclick="window.print()">&#128438; Print</button></div>'
    +'</div></div>'
  );
}


function renderOrgCharts() {
  function node(x,y,w,h,label,sub,fill,tc,bc){const ls=label.split('\n');const lh=13,th=ls.length*lh+(sub?14:0);const ty=y+(h-th)/2+lh*.75;const te=ls.map((l,i)=>`<text x="${x+w/2}" y="${ty+i*lh}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tc}" font-family="Arial,sans-serif">${l}</text>`).join('');const se=sub?`<text x="${x+w/2}" y="${ty+ls.length*lh+2}" text-anchor="middle" font-size="8" fill="${tc}" opacity=".75" font-family="Arial,sans-serif">${sub}</text>`:'';return`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${fill}" stroke="${bc}" stroke-width="1.5"/>${te}${se}`;}
  function arr(x1,y1,x2,y2,col){return`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.2" marker-end="url(#arr-${col.replace('#','')})"/>`;}
  function pill(x,y,w,lbl,fill,tc){return`<rect x="${x}" y="${y}" width="${w}" height="15" rx="7" fill="${fill}"/><text x="${x+w/2}" y="${y+10.5}" text-anchor="middle" font-size="8" font-weight="700" fill="${tc}" font-family="Arial,sans-serif">${lbl}</text>`;}
  function defs(cols){return`<defs>${cols.map(c=>`<marker id="arr-${c.replace('#','')}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="${c}"/></marker>`).join('')}</defs>`;}
  const NV='#0B0C44',TL='#006C80',EM='#118B80',SP='#8B7495',RD='#C0392B',OW='#F1EFF0',PL='#E4DEE0';

  const c1=`<svg viewBox="0 0 480 290" style="width:100%;height:auto;display:block">
    ${defs([RD,'#999','#ccc'])}
    <rect width="480" height="290" rx="4" fill="${OW}" stroke="${PL}" stroke-width="1"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="${RD}" font-family="Arial,sans-serif">LAGGING — Overloaded CFO model</text>
    ${node(175,26,130,36,'CFO','Reporting·FP&A·Control·Tax',RD,'#fff',RD)}
    ${arr(240,62,90,110,RD)}${arr(240,62,240,110,RD)}${arr(240,62,390,110,RD)}
    ${node(30,110,120,30,'Acting FC / Mgmt Acct','Covering FC duties','#88395A','#fff','#88395A')}
    ${node(180,110,120,30,'Bookkeeper / AP','Transactions only','#888','#fff','#888')}
    ${node(330,110,120,30,'No FP&A resource','CFO covers ad hoc','#aaa','#fff','#aaa')}
    <text x="10" y="162" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">SYSTEMS (FRAGMENTED)</text>
    ${pill(10,169,72,'Sage/Xero',PL,'#465576')}${pill(90,169,72,'Excel budget',PL,'#465576')}${pill(170,169,80,'Excel board pack',PL,'#465576')}${pill(258,169,68,'Payroll sw.',PL,'#465576')}${pill(334,169,68,'CRM unused',PL,'#465576')}
    <text x="10" y="207" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">EXTERNAL — Late board packs; no business partnering; reactive auditors</text>
    <text x="10" y="225" font-size="8" fill="${RD}" font-family="Arial,sans-serif">PE Board: late, revised packs &nbsp;|&nbsp; Ops: requests direct to CFO &nbsp;|&nbsp; Auditor: reactive; year-end surprises common</text>
    <text x="10" y="245" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">DATA: Siloed · no single version of truth · reconciliation manual and error-prone</text>
  </svg>`;

  const c2=`<svg viewBox="0 0 480 310" style="width:100%;height:auto;display:block">
    ${defs([SP,TL,'#ccc'])}
    <rect width="480" height="310" rx="4" fill="${OW}" stroke="${PL}" stroke-width="1"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="${SP}" font-family="Arial,sans-serif">EMERGING — Functional structure, stretched capacity</text>
    ${node(175,26,130,30,'CFO',null,SP,'#fff',SP)}
    ${node(50,88,110,30,'Financial Controller','Close · statutory · control',SP,'#fff',SP)}
    ${node(320,88,110,30,'FP&A Manager (×1)','Budget · forecast',SP,'#fff',SP)}
    ${arr(240,56,105,88,SP)}${arr(240,56,375,88,SP)}
    ${node(20,148,85,26,'Mgmt Acct','Journals·recon',SP,'#fff',SP)}
    ${node(112,148,70,26,'AP/AR clerk','Transactions',SP,'#fff',SP)}
    ${arr(105,118,62,148,SP)}${arr(105,118,147,148,SP)}
    ${node(310,148,100,26,'No FP&A support','Single pt of failure','#aaa','#fff','#aaa')}
    <text x="10" y="195" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">SYSTEMS</text>
    ${pill(10,202,90,'NetSuite/BC (ERP)',TL+'20',TL)}${pill(108,202,80,'Excel (FP&A)',PL,'#465576')}${pill(196,202,75,'PPT packs',PL,'#465576')}${pill(279,202,75,'Salesforce CRM',PL,'#465576')}${pill(362,202,80,'Payroll (out)',TL+'20',TL)}

function renderEditor(){
  const sh=document.getElementById('shell');
  let html=`<div class="card"><div class="section-title">Edit next steps content</div><div class="section-rule"></div><div class="ed-info">Changes save automatically. They appear immediately on participant result screens. Use this to tailor vendor recommendations to your portfolio.</div>`;
  DIMS.forEach((dim,di)=>{
    html+=`<div class="ed-section"><div class="ed-sec-title">${dim.label}</div>`;
    BANDS.forEach((band,bi)=>{
      const items=getItems(dim.label,bi);
      html+=`<div class="ed-band"><div class="ed-band-label"><span class="ed-pip" style="background:${BAND_COLORS[band[0]]}"></span>${BAND_LABELS_ED[bi]}</div>
        <div id="ed-items-${di}-${bi}">${items.map((item,ii)=>renderEdItem(di,bi,ii,item)).join('')}</div>
        <button class="ed-add" onclick="addEdItem(${di},${bi})">+ Add item</button>
      </div>`;
    });
    html+=`</div>`;
  });
  // Sponsor perception section
  html += '<div style="margin-top:24px;border-top:2px solid var(--bm-coral);padding-top:16px">'
    + '<div style="font-size:16px;font-weight:300;color:var(--bm-blue);font-family:var(--font-heading);letter-spacing:-0.01em;margin-bottom:4px">Sponsor perception overlay</div>'
    + '<div style="height:3px;background:var(--bm-coral);width:36px;margin-bottom:12px"></div>'
    + '<div style="font-size:12.5px;color:var(--bm-bluegrey);margin-bottom:16px;line-height:1.55">'
    + 'Enter the Investment Team\u2019s average score for each dimension (0.0\u20133.0). '
    + 'These appear as a coral diamond marker on each dimension chart in the facilitator view only \u2014 participants never see them. '
    + 'Enter the average of your team\u2019s responses to one decimal place (1.0 = Lagging, 2.0 = Emerging, 3.0 = Effective, 4.0 = Best-in-Class).</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px">';

  DIMS.forEach(function(d, di) {
    var sv = (sponsorView[di] !== null && sponsorView[di] !== undefined) ? parseFloat(sponsorView[di]) : '';
    html += '<div style="background:var(--bm-white);border:1px solid var(--bm-warmgrey);border-radius:2px;padding:10px 12px">'
      + '<div style="font-size:10px;font-weight:700;color:var(--bm-blue);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">' + d.label + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px">'
      + '<input type="number" id="sv-' + di + '" min="1" max="4" step="0.1" value="' + (sv !== '' ? (parseFloat(sv)+1).toFixed(1) : '') + '" '
      + 'style="width:70px;padding:6px 8px;border:1px solid var(--bm-warmgrey);border-radius:2px;font-size:13px;font-family:var(--font-body);color:var(--bm-blue)" '
      + 'placeholder="1.0\u20134.0" oninput="previewSponsor(' + di + ',this.value)">'
      + '<div id="sv-preview-' + di + '" style="font-size:11px;color:#FF6661;font-weight:700">'
      + (sv !== '' ? '\u9670 ' + (parseFloat(sv)+1).toFixed(1) : '') + '</div>'
      + '</div></div>';
  });

  html += '</div>'
    + '<button class="btn btn-primary" onclick="saveSponsorInputs()" style="margin-right:8px">Save sponsor scores</button>'
    + '<button class="btn" onclick="clearSponsorView()" style="color:#C0392B;border-color:#C0392B">Clear sponsor data</button>'
    + '</div>';

  html+=`<div class="nav-row"><button class="btn" onclick="if(confirm('Reset all to defaults?')){resetNS();renderEditor();}" style="color:#C0392B;border-color:#C0392B;font-size:12px">Reset to defaults</button><button class="btn btn-primary" onclick="setMode('participant')">Done editing</button></div></div>`;
  sh.innerHTML=html;
}

function previewSponsor(di, val) {
  var el = document.getElementById('sv-preview-' + di);
  if (!el) return;
  var v = parseFloat(val);
  el.textContent = (!isNaN(v) && v >= 1 && v <= 4) ? '◆ ' + v.toFixed(1) : '';
}

function saveSponsorInputs() {
  var scores = DIMS.map(function(_, di) {
    var input = document.getElementById('sv-' + di);
    if (!input || input.value === '') return null;
    var v = parseFloat(input.value);
    return (!isNaN(v) && v >= 1 && v <= 4) ? Math.round((v - 1) * 10) / 10 : null;
  });
  saveSponsorView(scores).then(function() {
    var btn = document.querySelector('[onclick="saveSponsorInputs()"]');
    if (btn) { btn.textContent = '✓ Saved'; setTimeout(function(){ btn.textContent = 'Save sponsor scores'; }, 2000); }
  });
}

function clearSponsorView() {
  if (!confirm('Clear all sponsor perception scores?')) return;
  sponsorView = Array(9).fill(null);
  saveSponsorView(Array(9).fill(null)).then(function(){ renderEditor(); });
}
function renderEdItem(di,bi,ii,item){const safe=(item.text||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');return`<div class="ed-item" id="ed-item-${di}-${bi}-${ii}"><select class="ed-type" onchange="updateEdItem(${di},${bi},${ii},'type',this.value)"><option value="process"${item.type==='process'?' selected':''}>Process</option><option value="potential_project"${item.type==='potential_project'?' selected':''}>Potential project</option></select><input class="ed-input" value="${safe}" oninput="updateEdItem(${di},${bi},${ii},'text',this.value)" placeholder="Enter recommendation..."><button class="ed-del" onclick="removeEdItem(${di},${bi},${ii})">×</button></div>`;}
function getOrCreateEntry(dimLabel,bandIdx){let e=nsData.find(e=>e.dim===dimLabel&&e.band===bandIdx);if(!e){e={dim:dimLabel,band:bandIdx,items:[]};nsData.push(e);}return e;}
function updateEdItem(di,bi,ii,field,val){const e=getOrCreateEntry(DIMS[di].label,bi);if(e.items[ii]){e.items[ii][field]=val;saveNS();}}
function removeEdItem(di,bi,ii){const e=getOrCreateEntry(DIMS[di].label,bi);e.items.splice(ii,1);saveNS();renderEditor();}
function addEdItem(di,bi){const e=getOrCreateEntry(DIMS[di].label,bi);e.items.push({type:'process',text:''});saveNS();renderEditor();setTimeout(()=>{const c=document.getElementById(`ed-items-${di}-${bi}`);if(c){const inp=c.querySelectorAll('.ed-input');if(inp.length)inp[inp.length-1].focus();}},50);}

// ── Init ──────────────────────────────────────────────────────────────────────
nsData=loadNS();
go(0);

  showSponsor = !showSponsor;
  renderFacilitator();
}

function goSlide(n) {
  facSlide = Math.max(0, Math.min(12, n));
  renderFacilitator();
}

function slideFPTab(di, bi) {
  var bkeys = ['lag','emg','eff','bic'];
  for (var i=0;i<4;i++) {
    var body = document.getElementById('sfp-'+di+'-'+i);
    if (body) body.classList.toggle('open', i===bi);
  }
  var first = document.getElementById('sfp-'+di+'-0');
  if (first && first.parentElement) {
    var tabs = first.parentElement.previousElementSibling.querySelectorAll('.slide-ftab');
    var colors = ['lag','emg','eff','bic'];
    tabs.forEach(function(tab,i){
      tab.className = 'slide-ftab'+(i===bi?' act-'+colors[i]:'');
    });
  }
}

// ── QR Code ───────────────────────────────────────────────────────────────
function showQR() {
  var modal = document.getElementById('qr-modal');
  var qrDiv = document.getElementById('qr-code');
  var urlDiv = document.getElementById('qr-url');
  var url = window.location.href;
  
  // Clear previous QR
  qrDiv.innerHTML = '';
  urlDiv.textContent = url;
  
  modal.style.display = 'flex';
  
  // Generate QR — use a small size that renders clearly on screen
  try {
    new QRCode(qrDiv, {
      text: url,
      width: 200,
      height: 200,
      colorDark: '#0B0C44',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    // Fallback to Google Charts API if QRCode lib not available
    var img = document.createElement('img');
    img.src = 'https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=' + encodeURIComponent(url) + '&choe=UTF-8';
    img.alt = 'QR Code';
    img.style.width = '200px';
    img.style.height = '200px';
    qrDiv.appendChild(img);
  }
}

function closeQR() {
  document.getElementById('qr-modal').style.display = 'none';
}

// Close modal on backdrop click
document.getElementById('qr-modal').addEventListener('click', function(e) {
  if (e.target === this) closeQR();
});
