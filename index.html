<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0C44">
<title>CFO Forum 2026 — Self Assessment | Bowmark Capital</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:#0B0C44; --steel:#465576; --ow:#F1EFF0; --slate:#9192AB;
  --pearl:#E4DEE0; --teal:#006C80; --aqua:#12C6A3; --emerald:#118B80;
  --sp:#8B7495; --coral:#FF6661;
}
body { font-family:'Arial Nova',Arial,sans-serif; background:var(--ow); color:var(--navy); min-height:100vh; }

.top-bar { background:var(--navy); padding:0.85rem 1.5rem; }
.top-bar-inner { max-width:860px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.top-left { display:flex; align-items:center; gap:12px; }
.top-pip { width:5px; height:32px; background:var(--teal); border-radius:1px; flex-shrink:0; }
.top-title { font-size:14px; font-weight:700; color:#fff; }
.top-sub { font-size:11px; color:var(--slate); margin-top:1px; }
.mode-toggle { display:flex; gap:4px; flex-wrap:wrap; }
.mode-btn { padding:6px 13px; border-radius:2px; border:1px solid rgba(145,146,171,0.4); background:transparent; font-size:11px; font-weight:700; color:var(--slate); cursor:pointer; font-family:inherit; transition:all .15s; }
.mode-btn.active { background:var(--teal); color:#fff; border-color:var(--teal); }
.mode-btn.edit-active { background:var(--sp); color:#fff; border-color:var(--sp); }
.mode-btn:hover:not(.active):not(.edit-active) { color:#fff; border-color:rgba(255,255,255,0.4); }

.progress-wrap { background:#fff; border-bottom:1px solid var(--pearl); padding:0.65rem 1.5rem; position:sticky; top:0; z-index:10; }
.progress-inner { max-width:860px; margin:0 auto; }
.progress-label { font-size:11px; color:var(--slate); margin-bottom:5px; }
.progress-bar { display:flex; gap:4px; }
.prog-step { flex:1; height:3px; border-radius:1px; background:var(--pearl); transition:background .3s; }
.prog-step.done { background:var(--teal); }
.prog-step.active { background:var(--navy); }

.shell { max-width:860px; margin:0 auto; padding:1.75rem 1.5rem 4rem; }
.card { background:#fff; border-radius:2px; padding:1.6rem; margin-bottom:1.1rem; border:1px solid var(--pearl); }
.section-title { font-size:20px; font-weight:700; color:var(--navy); margin-bottom:4px; }
.section-rule { height:3px; background:var(--teal); width:36px; margin-bottom:1.2rem; }
.sep { height:1px; background:var(--pearl); margin:1.2rem 0; }

.intro-card { background:var(--ow); border-radius:2px; padding:0.9rem 1.1rem; margin-bottom:0.85rem; border-left:3px solid var(--teal); }
.intro-card h3 { font-size:11px; font-weight:700; color:var(--navy); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.intro-card p { font-size:13px; color:var(--steel); line-height:1.6; }
.hold-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:9px; }
.hold-card { border-radius:2px; padding:9px 11px; border:1px solid var(--pearl); background:#fff; }
.hold-stage { font-size:10px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:2px; }
.hold-target { font-size:12px; color:var(--steel); }
.dim-dots { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
.dim-dot { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--pearl); color:var(--steel); background:#fff; word-break:break-word; }

/* 4-band score options */
.score-band-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; padding:2px 6px 2px 0; }
.dim-header { display:flex; align-items:center; gap:12px; margin-bottom:1.1rem; }
.dim-badge { width:38px; height:38px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--aqua); flex-shrink:0; }
.dim-title { font-size:17px; font-weight:700; color:var(--navy); }
.dim-sub { font-size:12px; color:var(--steel); margin-top:2px; }
.score-option { display:flex; align-items:stretch; border:1px solid var(--pearl); border-radius:2px; margin-bottom:7px; cursor:pointer; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
.score-option:hover { border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,108,128,0.08); }
.score-option:active { transform:scale(0.99); }
.score-option.selected { border-color:var(--teal); border-width:2px; }
.score-num { width:90px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex-shrink:0; padding:8px 4px; text-align:center; line-height:1.2; gap:2px; }
.score-num-val { font-size:18px; font-weight:700; }
.score-text { padding:11px 14px; font-size:12.5px; color:var(--steel); line-height:1.5; display:flex; align-items:center; }
.score-option.selected .score-text { color:var(--navy); font-weight:600; }

.nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:1.4rem; flex-wrap:wrap; gap:8px; }
.btn { padding:9px 20px; border-radius:2px; border:1px solid var(--pearl); background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--navy); font-family:inherit; transition:background .15s; }
.btn:hover { background:var(--ow); }
.btn:disabled { opacity:0.3; cursor:not-allowed; }
.btn-primary { background:var(--navy); color:var(--aqua); border-color:var(--navy); }
.btn-primary:hover { background:#14165c; }
.btn-teal { background:var(--teal); color:#fff; border-color:var(--teal); }
.btn-teal:hover { background:#005a6b; }
.step-label { font-size:12px; color:var(--slate); }

/* Results */
.radar-wrap { display:flex; justify-content:center; margin:0.5rem 0 1.3rem; overflow:visible; }
.score-summary { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:1.1rem; }
.sum-card { background:var(--ow); border-radius:2px; padding:10px 12px; border:1px solid var(--pearl); }
.sum-label { font-size:10px; color:var(--slate); margin-bottom:3px; text-transform:uppercase; letter-spacing:0.4px; }
.sum-val { font-size:14px; font-weight:700; }
.sum-band { font-size:10px; margin-top:2px; font-weight:700; }
.sum-bar-wrap { height:3px; background:var(--pearl); border-radius:1px; margin-top:5px; overflow:hidden; }
.sum-bar { height:100%; border-radius:1px; transition:width .8s; }
.avg-card { background:var(--navy); border-radius:2px; padding:1rem 1.2rem; margin-bottom:1.1rem; display:flex; gap:14px; align-items:center; }
.avg-num { font-size:28px; font-weight:700; color:var(--aqua); line-height:1; }
.avg-text { font-size:13px; color:#C8CAD8; line-height:1.5; flex:1; border-left:1px solid #2a2d60; padding-left:14px; }
.sub-banner { background:#e6f4f1; border:1px solid var(--teal); border-radius:2px; padding:9px 12px; margin-bottom:10px; font-size:12.5px; color:var(--teal); font-weight:700; }
.reflect-list { list-style:none; }
.reflect-list li { padding:9px 0 9px 22px; border-bottom:1px solid var(--pearl); font-size:13px; color:var(--steel); line-height:1.55; position:relative; }
.reflect-list li::before { content:"Q"; position:absolute; left:0; font-size:9px; font-weight:700; color:var(--teal); top:12px; }
.reflect-list li:last-child { border-bottom:none; }

/* Next steps */
.ns-panel { background:var(--ow); border:1px solid var(--pearl); border-radius:2px; padding:13px; margin-bottom:9px; }
.ns-title { font-size:11px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
.ns-pip { width:3px; height:13px; background:var(--teal); border-radius:1px; }
.ns-item { display:flex; gap:7px; align-items:flex-start; margin-bottom:6px; }
.ns-item:last-child { margin-bottom:0; }
.ns-badge { font-size:9px; font-weight:700; padding:2px 6px; border-radius:2px; flex-shrink:0; margin-top:2px; text-transform:uppercase; letter-spacing:0.4px; }
.ns-badge.vendor { background:rgba(11,12,68,0.08); color:var(--navy); }
.ns-badge.process { background:rgba(0,108,128,0.1); color:var(--teal); }
.ns-text { font-size:12.5px; color:var(--steel); line-height:1.45; }

/* Phased roadmap */
.roadmap-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.roadmap-col { border-radius:2px; overflow:hidden; border:1px solid var(--pearl); }
.roadmap-header { padding:7px 10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.roadmap-body { padding:8px 10px; background:#fff; }
.roadmap-item { font-size:11.5px; color:var(--steel); padding:4px 0; border-bottom:1px solid var(--pearl); line-height:1.4; display:flex; gap:5px; align-items:flex-start; }
.roadmap-item:last-child { border-bottom:none; }
.roadmap-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-top:4px; }

/* Value Foundations overlay */
.foundations-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.foundation-card { border-radius:2px; padding:10px 12px; border:1px solid var(--pearl); background:var(--ow); }
.foundation-label { font-size:10px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.foundation-bar-wrap { height:6px; background:var(--pearl); border-radius:2px; overflow:hidden; margin-bottom:4px; }
.foundation-bar { height:100%; border-radius:2px; }
.foundation-level { font-size:10px; font-weight:700; }
.foundation-desc { font-size:11px; color:var(--slate); margin-top:2px; line-height:1.4; }

/* Facilitator */
.dash-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:1.1rem; }
.dash-stat { background:var(--ow); border:1px solid var(--pearl); border-radius:2px; padding:10px 14px; }
.dash-stat-label { font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
.dash-stat-val { font-size:24px; font-weight:700; color:var(--navy); }
.dash-stat-sub { font-size:11px; color:var(--slate); margin-top:2px; }
.dim-section { margin-bottom:1.6rem; }
.dim-section-title { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dim-avg-pill { font-size:10px; font-weight:700; padding:2px 9px; border-radius:10px; }
.profiles-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:8px; }
.profile-card { background:var(--ow); border:1px solid var(--pearl); border-radius:2px; padding:10px; }
.profile-id { font-size:10px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.profile-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.profile-dim { font-size:10px; color:var(--slate); width:62px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-bar-track { flex:1; height:5px; background:var(--pearl); border-radius:1px; overflow:hidden; }
.profile-bar-fill { height:100%; border-radius:1px; }
.profile-band { font-size:9px; font-weight:700; flex-shrink:0; }
.profile-avg { font-size:11px; font-weight:700; margin-top:6px; padding-top:6px; border-top:1px solid var(--pearl); }
.prompt-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; }
.prompt-num { width:22px; height:22px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--aqua); flex-shrink:0; margin-top:1px; }
.prompt-text { font-size:13px; color:var(--steel); line-height:1.55; padding:9px 12px; border:1px solid var(--pearl); border-radius:2px; flex:1; background:var(--ow); }
.print-btn { display:inline-flex; align-items:center; gap:5px; padding:8px 16px; border-radius:2px; border:1px solid var(--teal); background:transparent; font-size:12px; font-weight:700; color:var(--teal); cursor:pointer; font-family:inherit; }
.print-btn:hover { background:rgba(0,108,128,0.06); }
.empty-state { text-align:center; padding:2.5rem 1rem; color:var(--slate); font-size:13px; }

/* KPI Benchmarks */
.benchmark-table { width:100%; border-collapse:collapse; font-size:11.5px; margin-top:10px; }
.benchmark-table th { background:var(--navy); color:#fff; padding:6px 10px; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; text-align:left; }
.benchmark-table td { padding:7px 10px; border-bottom:1px solid var(--pearl); color:var(--steel); vertical-align:top; }
.benchmark-table tr:last-child td { border-bottom:none; }
.benchmark-table tr:nth-child(even) td { background:var(--ow); }
.bm-kpi { color:var(--navy); font-weight:600; }
.bm-eff { color:var(--sp); font-weight:700; }
.bm-bic { color:var(--teal); font-weight:700; }

/* Capability checklist */
.cap-section { margin-top:14px; border-top:1px solid var(--pearl); padding-top:12px; }
.cap-section-title { font-size:10px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.cap-section-sub { font-size:11.5px; color:var(--slate); margin-bottom:10px; line-height:1.4; }
.cap-item { border-radius:2px; margin-bottom:6px; background:#fff; border:1px solid var(--pearl); overflow:hidden; transition:border-color .15s; }
.cap-item:hover { border-color:var(--teal); }
.cap-item-header { padding:9px 12px 7px; }
.cap-item-label { font-size:12.5px; color:var(--navy); line-height:1.4; font-weight:600; }
.cap-item-help { font-size:11px; color:var(--slate); margin-top:2px; line-height:1.35; }
.cap-item-btns { display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid var(--pearl); }
.cap-btn { border:none; background:transparent; padding:9px 4px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; border-right:1px solid var(--pearl); text-align:center; line-height:1.3; }
.cap-btn:last-child { border-right:none; }
.cap-btn:hover { background:var(--ow); }
.cap-btn.sel-monthly { background:#118B8015; color:#118B80; }
.cap-btn.sel-adhoc   { background:#8B749515; color:#8B7495; }
.cap-btn.sel-no      { background:#C0392B12; color:#C0392B; }
.cap-item.state-monthly { border-color:#118B80; }
.cap-item.state-adhoc   { border-color:#8B7495; }
.cap-item.state-no      { border-color:#C0392B; }

/* Heat map */
.heatmap-wrap { overflow-x:hidden; margin-top:10px; }
.heatmap { border-collapse:collapse; font-size:10px; width:100%; }
.heatmap th { background:var(--navy); color:#fff; padding:6px 8px; font-weight:700; font-size:10px; text-align:left; white-space:nowrap; }
.heatmap th.rotate { vertical-align:bottom; padding:8px 4px 4px; }
.heatmap th.rotate span { writing-mode:vertical-rl; transform:rotate(180deg); display:block; max-height:80px; overflow:hidden; font-size:9px; letter-spacing:0.3px; }
.heatmap td { padding:4px 6px; border:1px solid var(--pearl); vertical-align:middle; }
.heatmap tr.data-row:nth-child(even) td:not(.hm-monthly):not(.hm-adhoc):not(.hm-no) { background:var(--ow); }
.hm-label { font-size:10px; color:var(--navy); font-weight:400; white-space:normal; word-break:break-word; }
.hm-monthly { background:#118B8022 !important; text-align:center; font-size:10px; font-weight:700; color:#118B80; }
.hm-adhoc   { background:#8B749520 !important; text-align:center; font-size:10px; font-weight:700; color:#8B7495; }
.hm-no      { background:#C0392B15 !important; text-align:center; font-size:10px; font-weight:700; color:#C0392B; }
.hm-grp-score { font-size:11px; font-weight:700; text-align:center; }
.hm-grp-pct { font-size:9px; color:var(--slate); }
.hm-dim-header { background:var(--navy); }
.hm-dim-label { color:var(--aqua); font-weight:700; font-size:10px; padding:4px 8px; }

/* Facilitator enrichment */
.enrich-section { margin-bottom:2rem; }
.enrich-title { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:6px; }
.enrich-sub { font-size:12px; color:var(--slate); margin-bottom:12px; line-height:1.5; }

/* Reference cards */
.ref-card-wrap { border:1px solid var(--pearl); border-radius:2px; margin-bottom:10px; overflow:hidden; }
.ref-card-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; cursor:pointer; background:var(--ow); user-select:none; }
.ref-card-dim { font-size:13px; font-weight:700; color:var(--navy); }
.ref-card-chevron { font-size:12px; color:var(--slate); transition:transform .2s; }
.ref-card-body { display:none; padding:14px; background:#fff; }
.ref-card-body.open { display:block; }
.ref-bands-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.ref-band { border-radius:2px; padding:10px 11px; border:1px solid var(--pearl); }
.ref-band-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:7px; }
.ref-band-points { list-style:none; }
.ref-band-points li { font-size:11px; color:var(--steel); line-height:1.45; margin-bottom:5px; padding-left:12px; position:relative; }
.ref-band-points li::before { content:"\2022"; position:absolute; left:0; color:inherit; opacity:.5; }
@media(max-width:640px) { .ref-bands-grid { grid-template-columns:1fr 1fr; } }

/* Failure patterns */
.pattern-card { border:1px solid var(--pearl); border-radius:2px; margin-bottom:8px; overflow:hidden; }
.pattern-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; cursor:pointer; background:var(--ow); }
.pattern-dim { font-size:13px; font-weight:700; color:var(--navy); }
.pattern-band-tabs { display:flex; border-top:1px solid var(--pearl); }
.pattern-tab { flex:1; padding:7px 6px; font-size:10px; font-weight:700; text-align:center; cursor:pointer; border-right:1px solid var(--pearl); color:var(--slate); background:#fff; border:none; font-family:inherit; transition:background .12s; }
.pattern-tab:last-child { border-right:none; }
.pattern-tab.active-lag     { background:#C0392B15; color:#C0392B; }
.pattern-tab.active-emg     { background:#88395A15; color:#88395A; }
.pattern-tab.active-eff     { background:#006C8015; color:#006C80; }
.pattern-tab.active-bic     { background:#118B8015; color:#118B80; }
.pattern-body { display:none; padding:13px 14px; background:#fff; font-size:12.5px; color:var(--steel); line-height:1.65; }
.pattern-body.open { display:block; }

/* Consolidated next steps */
.action-group { margin-bottom:14px; }
.action-group-title { font-size:11px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; display:flex; align-items:center; gap:7px; }
.action-item { display:flex; gap:10px; align-items:flex-start; margin-bottom:7px; padding:10px 12px; background:var(--ow); border:1px solid var(--pearl); border-radius:2px; border-left:3px solid var(--teal); }
.action-dim-label { font-size:9px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.4px; flex-shrink:0; padding-top:1px; width:80px; }
.action-text { font-size:12.5px; color:var(--steel); line-height:1.5; }
.action-item.urgency-high { border-left-color:#C0392B; }
.action-item.urgency-high .action-dim-label { color:#C0392B; }
.action-item.urgency-mid { border-left-color:#8B7495; }
.action-item.urgency-mid .action-dim-label { color:#8B7495; }

/* Editor */
.ed-section { margin-bottom:20px; }
.ed-sec-title { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--teal); }
.ed-band { background:var(--ow); border-radius:2px; padding:12px; margin-bottom:8px; border:1px solid var(--pearl); }
.ed-band-label { font-size:10px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.ed-pip { width:10px; height:10px; border-radius:1px; display:inline-block; }
.ed-item { display:flex; gap:6px; align-items:center; margin-bottom:5px; }
.ed-type { font-size:11px; padding:5px 7px; border:1px solid var(--pearl); border-radius:2px; background:#fff; color:var(--navy); cursor:pointer; font-family:inherit; flex-shrink:0; }
.ed-input { flex:1; font-size:12.5px; padding:7px 9px; border:1px solid var(--pearl); border-radius:2px; background:#fff; color:var(--navy); font-family:inherit; }
.ed-input:focus { outline:none; border-color:var(--teal); }
.ed-del { width:26px; height:26px; border-radius:2px; border:1px solid var(--pearl); background:#fff; cursor:pointer; font-size:15px; color:var(--slate); flex-shrink:0; font-family:inherit; display:flex; align-items:center; justify-content:center; }
.ed-del:hover { border-color:#C0392B; color:#C0392B; }

// ── Value Foundations logic ───────────────────────────────────────────────────
// Maps each dim's score band to a Technology, People, Process, Data rating
function deriveFoundations(bands) {
  // bands is array of 9 values (0-3 or null)
  // dims: 0=Team, 1=Role, 2=Outsourcing, 3=Systems, 4=Governance, 5=Exit, 6=Cash, 7=Data, 8=BizPartner
  const get = (i) => (bands[i] == null ? 0 : bands[i]);
  // Technology: Systems (3) + Data (7) + Governance (4)
  const tech   = Math.round(get(3)*0.5 + get(7)*0.3 + get(4)*0.2);
  // People: Role Design (1) + Team Model (0) + Biz Partnering (8)
  const people = Math.round(get(1)*0.4 + get(0)*0.35 + get(8)*0.25);
  // Process: Outsourcing (2) + Governance (4) + Cash (6) + Team Model (0)
  const proc   = Math.round(get(2)*0.3 + get(4)*0.3 + get(6)*0.25 + get(0)*0.15);
  // Data: Data Quality (7) + Systems (3) + Biz Partnering (8)
  const data   = Math.round(get(7)*0.5 + get(3)*0.3 + get(8)*0.2);
  return { tech, people, proc, data };
}

// Save a response to Supabase (async)
function saveResponse(scores, caps) {
  var payload = {
    data: {
      id: Date.now(),
      ts: Date.now(),
      scores: scores.slice(),
      capabilities: Object.assign({}, caps)
    }
  };
  fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE, {
    method: 'POST',
    headers: supabaseHeaders(),
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (!r.ok) {
      r.text().then(function(t){ console.error('Supabase save error:', t); });
    }
  }).catch(function(e) {
    console.error('Supabase unreachable, saving locally:', e);
    // Fallback to localStorage
    try {
      var all = JSON.parse(localStorage.getItem(RESP_KEY)||'[]');
      all.push(payload.data);
      localStorage.setItem(RESP_KEY, JSON.stringify(all));
    } catch(ex) {}
  });
}

// Load all responses from Supabase (returns a Promise)
function loadResponses() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    // Not yet configured — use localStorage
    try { return Promise.resolve(JSON.parse(localStorage.getItem(RESP_KEY)||'[]')); }
    catch(e) { return Promise.resolve([]); }
  }
  return fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE + '?select=data&order=id.asc', {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    // Each row has a .data field containing the response object
    return rows.map(function(row, i) {
      var d = row.data;
      d.id = i + 1; // re-number for display
      return d;
    });
  })
  .catch(function(e) {
    console.error('Supabase load failed, falling back to localStorage:', e);
    try { return JSON.parse(localStorage.getItem(RESP_KEY)||'[]'); }
    catch(ex) { return []; }
  });
}

// ── Radar SVG ─────────────────────────────────────────────────────────────────
function drawRadar(vals, size, stroke) { // vals are 0-3 band values, normalise to 0-1
  const norm=vals.map(v=>v==null?0:(v+1)/4);
  const cx=size/2,cy=size/2,r=size*0.35,n=9;
  const ang=Array.from({length:n},(_,i)=>-Math.PI/2+(2*Math.PI/n)*i);
  const pt=(v,i)=>{const m=r*v;return[cx+m*Math.cos(ang[i]),cy+m*Math.sin(ang[i])];};
  const poly=pts=>pts.map(p=>p.join(',')).join(' ');
  const grids=[0.25,0.5,0.75,1].map(g=>{const gp=DIMS.map((_,i)=>[cx+r*g*Math.cos(ang[i]),cy+r*g*Math.sin(ang[i])]);return`<polygon points="${poly(gp)}" fill="none" stroke="#E4DEE0" stroke-width="1.2"/>`;}).join('');
  const axes=ang.map(a=>`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#E4DEE0" stroke-width="1.2"/>`).join('');
  const sp=norm.map((v,i)=>pt(v,i));
  const shape=`<polygon points="${poly(sp)}" fill="${stroke}" fill-opacity=".15" stroke="${stroke}" stroke-width="2.5"/>`;
  const dots=sp.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${stroke}" stroke="#fff" stroke-width="2"/>`).join('');
  const ls=size<220?8:10,ld=r+size*0.1;
  const lbls=Array.from({length:n},(_,i)=>{const d=DIMS[i]||{short:''};const lx=cx+ld*Math.cos(ang[i]),ly=cy+ld*Math.sin(ang[i]);const a=Math.abs(Math.cos(ang[i]))<0.15?'middle':Math.cos(ang[i])>0?'start':'end';return`<text x="${lx}" y="${ly}" text-anchor="${a}" dominant-baseline="middle" font-size="${ls}" fill="#465576" font-family="Arial,sans-serif">${d.short}</text>`;}).join('');
  return`<svg viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;overflow:visible">${grids}${axes}${shape}${dots}${lbls}</svg>`;
}

  var hasCaps = CAPABILITIES.some(function(c){ return myCapabilities[c.id] !== undefined; });

  var dimLabels = { 7:'Data & Analytics', 8:'Business Partnering', 4:'Governance & Reporting', 6:'Cash & Working Capital', 5:'Exit Readiness' };

  dimOrder.forEach(function(dimIdx) {
    var caps = CAPABILITIES.filter(function(c){ return c.dim === dimIdx; });

    rows += '<tr><td colspan="2" class="hm-dim-header"><span class="hm-dim-label">' + dimLabels[dimIdx] + '</span></td></tr>';

  var pct = maxScore > 0 ? Math.round(totalScore/maxScore*100) : 0;
  var monthly = answered.filter(function(c){ return myCapabilities[c.id]==='monthly'; }).length;
  var adhoc   = answered.filter(function(c){ return myCapabilities[c.id]==='adhoc'; }).length;
  var no      = answered.filter(function(c){ return myCapabilities[c.id]==='no'; }).length;
  var color = pct >= 70 ? '#118B80' : pct >= 40 ? '#8B7495' : '#C0392B';
  var label = pct >= 70 ? 'Strong analytical foundation.' : pct >= 40 ? 'Developing — focus on moving Ad-Hoc outputs to Monthly.' : 'Significant gaps — these will surface in buyer DD.';

  return '<div class="sep"></div>'
       + '<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Capability snapshot</div>'
       + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:10px">'
       + '<div style="background:var(--ow);border-radius:2px;padding:9px 10px;border:1px solid var(--pearl);text-align:center"><div style="font-size:20px;font-weight:700;color:' + color + '">' + pct + '%</div><div style="font-size:10px;color:var(--slate)">Maturity score</div></div>'
       + '<div style="background:#118B8010;border-radius:2px;padding:9px 10px;border:1px solid #118B8030;text-align:center"><div style="font-size:20px;font-weight:700;color:#118B80">' + monthly + '</div><div style="font-size:10px;color:var(--slate)">Monthly</div></div>'
       + '<div style="background:#8B749510;border-radius:2px;padding:9px 10px;border:1px solid #8B749530;text-align:center"><div style="font-size:20px;font-weight:700;color:#8B7495">' + adhoc + '</div><div style="font-size:10px;color:var(--slate)">Ad-Hoc</div></div>'
       + '<div style="background:#C0392B10;border-radius:2px;padding:9px 10px;border:1px solid #C0392B30;text-align:center"><div style="font-size:20px;font-weight:700;color:#C0392B">' + no + '</div><div style="font-size:10px;color:var(--slate)">Cannot Produce</div></div>'
       + '</div>'
       + '<div style="font-size:11.5px;color:var(--slate);margin-bottom:10px;font-style:italic">' + label + '</div>'
       + '<div class="heatmap-wrap"><table class="heatmap">'
       + '<thead><tr><th>Capability</th><th style="text-align:center;white-space:nowrap;width:1%">Status</th></tr></thead>'
       + '<tbody>' + rows + '</tbody>'
       + '</table></div>';
}
function submitToGroup(){
  if(myScores.filter(s=>s!==null).length<9){
    alert('Please complete all nine dimensions first.');
    return;
  }
  // Show submitting state
  var btn = document.querySelector('.btn-teal');
  if(btn){ btn.textContent='Submitting...'; btn.disabled=true; }
  saveResponse(myScores, myCapabilities);
  // Small delay to allow the async POST to fire before re-rendering
  setTimeout(function(){
    submitted=true;
    go(10);
  }, 600);
}
function resetParticipant(){myScores=Array(9).fill(null);myCapabilities={};submitted=false;go(0);}

function exportToExcel() {
  loadResponses().then(function(responses) {
  if (!responses.length) { alert('No responses to export yet.'); return; }

  var wb = XLSX.utils.book_new();

  // ── Sheet 1: Summary scores ───────────────────────────────────────────
  var summaryData = [];
  // Header row
  var hdr = ['Participant', 'Submitted'];
  DIMS.forEach(function(d) { hdr.push(d.label); });
  hdr.push('Overall Band');
  summaryData.push(hdr);

  // Data rows
  responses.forEach(function(r) {
    var row = ['Participant ' + r.id, new Date(r.ts).toLocaleString('en-GB')];
    var total = 0; var count = 0;
    DIMS.forEach(function(d, i) {
      var v = r.scores[i];
      row.push(v !== null && v !== undefined ? BAND_NAMES[v] : '—');
      if (v !== null && v !== undefined) { total += v; count++; }
    });
    var avg = count > 0 ? Math.round(total/count) : 0;
    row.push(BAND_NAMES[avg]);
    summaryData.push(row);
  });

  // Group averages row
  var avgRow = ['GROUP AVERAGE', ''];
  DIMS.forEach(function(d, i) {
    var vals = responses.map(function(r){ return r.scores[i]; }).filter(function(v){ return v !== null && v !== undefined; });
    if (vals.length) {
      var avg = Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
      avgRow.push(BAND_NAMES[avg]);
    } else { avgRow.push('—'); }
  });
  var allVals = [];
  responses.forEach(function(r){ r.scores.forEach(function(v){ if(v!==null&&v!==undefined) allVals.push(v); }); });
  avgRow.push(allVals.length ? BAND_NAMES[Math.round(allVals.reduce(function(a,b){return a+b;},0)/allVals.length)] : '—');
  summaryData.push([]);
  summaryData.push(avgRow);

  var wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
  // Column widths
  wsSummary['!cols'] = [18,18].concat(DIMS.map(function(){ return {wch:24}; })).concat([{wch:18}]);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Score Summary');

  // ── Sheet 2: Score distributions ─────────────────────────────────────
  var distData = [['Dimension', 'Compass', 'Lagging', 'Emerging', 'Effective', 'Best-in-Class', 'Modal Band', 'Responses']];
  DIMS.forEach(function(d, i) {
    var counts = [0,0,0,0];
    responses.forEach(function(r){ var v=r.scores[i]; if(v!==null&&v!==undefined) counts[v]++; });
    var total = counts.reduce(function(a,b){return a+b;},0);
    var modal = counts.indexOf(Math.max.apply(null, counts));
    distData.push([d.label, d.compass, counts[0], counts[1], counts[2], counts[3], BAND_NAMES[modal], total]);
  });
  var wsDist = XLSX.utils.aoa_to_sheet(distData);
  wsDist['!cols'] = [{wch:28},{wch:20},{wch:12},{wch:12},{wch:12},{wch:16},{wch:18},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsDist, 'Distributions');

  // ── Sheet 3: Capability heat map ──────────────────────────────────────
  var hasCaps = responses.some(function(r){ return r.capabilities && Object.keys(r.capabilities).length > 0; });
  if (hasCaps) {
    var capData = [];
    var capHdr = ['Capability', 'Dimension'];
    responses.forEach(function(r){ capHdr.push('P' + r.id); });
    capHdr.push('Can produce (count)', 'Can produce (%)');
    capData.push(capHdr);

    var dimLabels = {4:'Governance & Reporting',5:'Exit Readiness',6:'Cash & Working Capital',7:'Data & Analytics',8:'Business Partnering'};
    var dimOrder = [7,8,4,6,5];
    dimOrder.forEach(function(dimIdx) {
      var caps = CAPABILITIES.filter(function(c){ return c.dim === dimIdx; });
      if (!caps.length) return;
      // Section header row
      capData.push([dimLabels[dimIdx]].concat(Array(responses.length+3).fill('')));
      caps.forEach(function(cap) {
        var row = [cap.label, dimLabels[dimIdx]];
        var yesCount = 0; var attempted = 0;
        responses.forEach(function(r) {
          var caps_data = r.capabilities || {};
          var val = caps_data[cap.id];
          if (val === undefined) { row.push('—'); }
          else {
            var label = val==='monthly'?'Monthly':val==='adhoc'?'Ad-Hoc':'No';
            row.push(label);
            yesCount += (val==='monthly'?2:val==='adhoc'?1:0);
            attempted++;
          }
        });
        // Convert to % of max possible score
        var capPct = attempted > 0 ? Math.round(yesCount/(attempted*2)*100) + '%' : '—';
        row.push(yesCount + '/' + (attempted*2) + ' pts');
        row.push(capPct);
        capData.push(row);
      });
    });

    var wsCaps = XLSX.utils.aoa_to_sheet(capData);
    wsCaps['!cols'] = [{wch:45},{wch:25}].concat(responses.map(function(){ return {wch:8}; })).concat([{wch:20},{wch:18}]);
    XLSX.utils.book_append_sheet(wb, wsCaps, 'Capability Heatmap');
  }

  // ── Sheet 4: Individual profiles ─────────────────────────────────────
  var profileData = [['Participant', 'Submitted'].concat(DIMS.map(function(d){ return d.label; })).concat(['Overall Band', 'Capabilities confirmed', 'Capabilities attempted', 'Capability %'])];
  responses.forEach(function(r) {
    var row = ['Participant ' + r.id, new Date(r.ts).toLocaleString('en-GB')];
    var total=0; var count=0;
    DIMS.forEach(function(d,i){
      var v=r.scores[i];
      row.push(v!==null&&v!==undefined?BAND_NAMES[v]:'—');
      if(v!==null&&v!==undefined){total+=v;count++;}
    });
    var avg = count>0?Math.round(total/count):0;
    row.push(BAND_NAMES[avg]);
    var caps_data = r.capabilities || {};
    var capKeys = Object.keys(caps_data);
    var capYes = capKeys.filter(function(k){ return caps_data[k]===true; }).length;
    row.push(capYes, capKeys.length, capKeys.length>0?Math.round(capYes/capKeys.length*100)+'%':'—');
    profileData.push(row);
  });
  var wsProfiles = XLSX.utils.aoa_to_sheet(profileData);
  wsProfiles['!cols'] = [{wch:18},{wch:20}].concat(DIMS.map(function(){ return {wch:24}; })).concat([{wch:16},{wch:22},{wch:22},{wch:16}]);
  XLSX.utils.book_append_sheet(wb, wsProfiles, 'Individual Profiles');

  // ── Sheet 5: KPI Benchmarks ───────────────────────────────────────────
  var kpiData = [['Dimension', 'KPI', 'Effective (target)', 'Best-in-Class (target)', 'Note']];
  BENCHMARKS_KPI.forEach(function(b) {
    b.kpis.forEach(function(k, i) {
      kpiData.push([i===0?b.dim:'', k.kpi, k.eff, k.bic, k.note]);
    });
    kpiData.push(['','','','','']); // blank row between dims
  });
  var wsKpi = XLSX.utils.aoa_to_sheet(kpiData);
  wsKpi['!cols'] = [{wch:28},{wch:45},{wch:22},{wch:22},{wch:50}];
  XLSX.utils.book_append_sheet(wb, wsKpi, 'KPI Benchmarks');

  // ── Download ──────────────────────────────────────────────────────────
  var date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'Bowmark_CFO_Workshop_' + date + '.xlsx');
  }); // end loadResponses().then
}

    bic:'Best-in-Class outsourcing is aligned to the exit timeline. Tax co-source is producing transfer pricing documentation and a vendor DD-ready tax report. IA has covered the key risk areas that a buyer will scrutinise. The conversation: what would an acquirer find in a tax or controls review that you have not already found yourself?',
  }},
  { dim:3, patterns:{
    lag:'Lagging systems is the most common dimension failure across the portfolio. The root cause is almost never budget — it is prioritisation. Finance transformation was in the 100-day plan but got deprioritised by operational demands. The risk is that by year 2-3, a manual finance function has become a genuine constraint on growth. The question: how many hours per week does the finance team spend reconciling data vs analysing it?',
    emg:'Emerging systems typically means a decent ERP implemented at acquisition but FP&A still running in Excel. The ERP is the right foundation; the gap is a purpose-built FP&A layer on top. The tools (Pigment, Mosaic, Adaptive) have come down significantly in cost and implementation time. The diagnostic: could the CFO reforecast in under 48 hours if asked to by the board?',
    eff:'Effective systems often have an integration gap — the ERP works, the FP&A tool works, but they do not talk to each other automatically. Month-end still involves manual data exports and imports. The last mile of automation is usually the most valuable and the most neglected. The question: what is the last manual step in your month-end process, and why has it not been automated?',
    bic:'Best-in-Class systems creates a new risk: data dependency. If the real-time dashboard goes down, can the team produce a manual report? And is the data architecture exit DD-ready — can a buyer re-run the analysis themselves from the underlying data? Diligence teams increasingly want to run their own queries, not just receive outputs.',
  }},
  { dim:4, patterns:{
    lag:'Lagging governance almost always traces back to two things: no agreed close calendar with named owners, and no fixed board pack template agreed with the PE investor. These are both fixable within 30 days at zero cost. The close calendar failure is a management problem, not a systems problem — the same tasks are being done every month but without a day-by-day sequence. The question: on what day of the month does the finance team know they are going to miss the deadline?',
    emg:'Emerging governance means the close happens but the board pack is assembled under pressure and reflects the past rather than the future. The single highest-value change is to shift the executive summary from a variance explanation ("revenue was down because...") to a forward statement ("we expect to land at £X for the full year because..."). This change requires no systems investment — only a different question being asked in the monthly review.',
    eff:'Effective governance starts to create its own problem: the CFO is producing great reporting but the business is not acting on it. The issue is often that KPIs are tracked but not owned — there is no one accountable for moving the number. The conversation: for each KPI in the board pack, who is the named person who will be held accountable if it does not improve?',
    bic:'Best-in-Class governance is investor-grade: a buyer could read 12 months of board packs and understand the business without asking a single question. The diagnostic is to give the last 3 board packs to someone who has not seen them and ask if the equity story is clear. If they cannot articulate it, the reporting is not yet exit-ready.',
  }},
  { dim:5, patterns:{
    lag:'Lagging exit readiness does not mean exit is far away — it means exit has not been treated as a project. The most common failure pattern is a CFO who knows intellectually that exit readiness matters but has not started because the exit feels distant or uncertain. The data room is empty. The equity story has never been written down. The management team has never been rehearsed. The diagnostic: ask the CFO to articulate the equity story in 90 seconds. Most cannot.',
    emg:'Emerging exit readiness means some work has started but it is fragmented: the PE sponsor has done buyer mapping, the CFO has a rough equity story, the data room has some documents. The gap is a programme — a structured workplan with owners, deadlines and a mock diligence date. The question: who owns exit readiness as a project, and what is their deadline for being ready?',
    eff:'Effective exit readiness means the infrastructure is in place but has not been stress-tested. The data room is populated but no one has tried to answer a buyer question from it. The equity story has been written but not rehearsed against a sceptical audience. The most valuable next step is a mock DD session with an external adviser who will push hard on the numbers.',
    bic:'Best-in-Class exit readiness is a mindset, not just a document set. The CFO talks about the business the way a buyer would — in terms of recurring revenue, net revenue retention, margin expansion opportunity and multiple arbitrage. Every management meeting includes a "how does this affect our exit story" lens. The question: could the CFO run a full management presentation tomorrow with 24 hours notice?',
  }},
  { dim:6, patterns:{
    lag:'Lagging cash management typically means working capital is not being managed — it is being reported. The DSO number exists in the board pack but nobody is accountable for improving it. The most common structural gap is that AR is owned by finance but the inputs (customer payment terms, dispute resolution) are owned by sales — and the two functions do not have a joined-up process. The diagnostic: who in the business is incentivised on cash conversion, and what is their current target?',
    emg:'Emerging cash management usually means the 13-week forecast exists but is not trusted. The forecast is produced in a spreadsheet, relies on assumptions that are not challenged, and the variance analysis is not used to improve accuracy. The fix is a weekly cash call with named owners for each assumption — not a finance exercise but a commercial one.',
    eff:'Effective cash management often misses the working capital optimisation opportunity. DSO and DPO are tracked but payment terms have not been strategically renegotiated with key suppliers or customers. A targeted review of the top 10 debtors and top 10 creditors usually uncovers 15-30 days of working capital improvement that goes straight to cash. The question: when did you last renegotiate payment terms with your largest suppliers?',
    bic:'Best-in-Class cash management is integrated into the VCP and tracked by the PE sponsor as a primary lever. The CFO can model the cash and leverage impact of any operational decision in real time. Covenant headroom is continuously monitored and stress-tested. The conversation: what is your current covenant headroom, and what is the scenario that puts it at risk?',
  }},
  { dim:7, patterns:{
    lag:'Lagging data quality is the hidden tax on every other dimension. A finance team that does not trust its own numbers cannot do FP&A properly, cannot business partner credibly, and cannot produce an exit-ready data room. The most common symptom is that every month-end involves a debate about which number is right before anyone can analyse what it means. The diagnostic: in your last board meeting, how many minutes were spent debating the numbers vs discussing what to do about them?',
    emg:'Emerging data quality means the numbers are broadly right but the definitions are wrong — different functions calculate the same metric differently. The KPI dictionary does not exist or is not enforced. This becomes a serious exit risk when a buyer asks for a revenue bridge and gets three different versions from three different systems. The fix is a governance exercise, not a systems project: one owner, one definition, one source for each metric.',
    eff:'Effective data quality starts to hit a ceiling when the data infrastructure cannot support the analytical questions being asked. The dashboards are good but they cannot drill below entity level to customer, product or geography. This is almost always a data model problem — the chart of accounts was not designed to support the level of segmentation the business now needs. The question: what analytical question can your CFO not currently answer from the data they have?',
    bic:'Best-in-Class data is a competitive advantage in a sale process. A buyer who can re-run your analysis from your own data, and gets the same answer, has much higher confidence in the business. The diagnostic: is your data architecture documented well enough that a new analyst could understand it in one day? Could a buyer? If not, it is a risk.',
  }},
  { dim:8, patterns:{
    lag:'Lagging business partnering means finance is a service function, not a strategic one. The CFO attends operational meetings but talks about last month numbers rather than next month decisions. The most common root cause is that finance does not have access to the data it needs to be forward-looking — the CRM, the ops system and the finance system are not connected. The question: can the CFO tell you today what revenue will land this month, and with what confidence?',
    emg:'Emerging business partnering means one or two individuals are doing it well, but it is personality-driven rather than structural. When that person leaves, the capability disappears. The fix is to embed the behaviour in a process: a standard template for business reviews that requires a forward-looking section, and a requirement that finance signs off on all investment decisions above a threshold. The question: which business decisions in the last 3 months did finance not have input into?',
    eff:'Effective business partnering often stalls because finance has the right conversations but does not have commercial credibility. Operational leaders respect the numbers but do not feel finance understands their business well enough to challenge assumptions. The fix is rotations or embeds — a finance team member spending time in a BU — rather than more dashboards. The question: could your finance business partners explain how the business makes money to a new joiner?',
    bic:'Best-in-Class business partnering is where finance actively shapes strategy rather than just reporting on it. The CFO is in the room when customer contracts are negotiated, pricing decisions are made and M&A targets are screened. The diagnostic: in the last 12 months, name one commercial decision that was materially different because of finance input. If the answer is not immediate, the partnership is not yet strategic.',

// ── Reference cards render ────────────────────────────────────────────────────
function renderReferenceCards() {
  var cards = '';
  RUBRIC_CARDS.forEach(function(rc) {
    var bandColors = ['#C0392B','#88395A','#006C80','#118B80'];
    var bandBgs    = ['#C0392B08','#88395A08','#006C8008','#118B8008'];
    var bandsHtml  = rc.bands.map(function(b, bi) {
      var pts = b.points.map(function(p){ return '<li>' + p + '</li>'; }).join('');
      return '<div class="ref-band" style="border-color:' + bandColors[bi] + '28;background:' + bandBgs[bi] + '">'
           + '<div class="ref-band-label" style="color:' + bandColors[bi] + '">' + b.band + '</div>'
           + '<ul class="ref-band-points" style="color:' + bandColors[bi] + 'dd">' + pts + '</ul>'
           + '</div>';
    }).join('');
    var id = 'ref-' + rc.dim;
    cards += '<div class="ref-card-wrap">'
           + '<div class="ref-card-header" onclick="toggleRefCard(\' + id + \')">'
           + '<span class="ref-card-dim">' + DIMS[rc.dim].label + ' <span style="font-size:10px;font-weight:400;color:var(--slate)">' + DIMS[rc.dim].compass + '</span></span>'
           + '<span class="ref-card-chevron" id="chev-' + id + '">&#9660;</span>'
           + '</div>'
           + '<div class="ref-card-body" id="' + id + '">'
           + '<div class="ref-bands-grid">' + bandsHtml + '</div>'
           + '</div>'
           + '</div>';
  });
  return '<div class="enrich-section">'
       + '<div class="enrich-title">What each band looks like — dimension reference cards</div>'
       + '<div class="enrich-sub">Expand any dimension to show the four-band rubric side by side. Use during discussion to help the group calibrate their scores.</div>'
       + cards
       + '</div>';
}

function toggleRefCard(id) {
  var body = document.getElementById(id);
  var chev = document.getElementById('chev-' + id);
  if (!body) return;
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  if (chev) chev.innerHTML = isOpen ? '&#9660;' : '&#9650;';
}

// ── Failure patterns render ───────────────────────────────────────────────────
function renderFailurePatterns(dimAvgBand) {
  var cards = '';
  FAILURE_PATTERNS.forEach(function(fp) {
    var modal = Math.round(dimAvgBand[fp.dim]);
    var bandKeys = ['lag','emg','eff','bic'];
    var tabColors = ['lag','emg','eff','bic'];
    var tabLabels = ['Lagging','Emerging','Effective','Best-in-Class'];
    var id = 'pat-' + fp.dim;

    var tabs = bandKeys.map(function(bk, bi) {
      var activeClass = bi === modal ? ' active-' + tabColors[bi] : '';
      return '<button class="pattern-tab' + activeClass + '" '
           + 'onclick="showPattern(\' + id + \',' + bi + ')">'
           + tabLabels[bi] + '</button>';
    }).join('');

    var bodies = bandKeys.map(function(bk, bi) {
      return '<div class="pattern-body' + (bi===modal?' open':'') + '" id="' + id + '-' + bi + '">'
           + fp.patterns[bk]
           + '</div>';
    }).join('');

    cards += '<div class="pattern-card">'
           + '<div class="pattern-header">'
           + '<span class="pattern-dim">' + DIMS[fp.dim].label + '</span>'
           + '<span style="font-size:11px;color:var(--slate)">Group modal: <strong style="color:' + BAND_COLORS[modal] + '">' + BAND_NAMES[modal] + '</strong></span>'
           + '</div>'
           + '<div class="pattern-band-tabs">' + tabs + '</div>'
           + bodies
           + '</div>';
  });

  return '<div class="enrich-section">'
       + '<div class="enrich-title">Common failure patterns by dimension</div>'
       + '<div class="enrich-sub">Each tab shows the typical root causes and diagnostic questions for that band. The group modal band is shown by default — click to explore others.</div>'
       + cards
       + '</div>';
}

function showPattern(id, bandIdx) {
  var tabColors = ['lag','emg','eff','bic'];
  for (var bi = 0; bi < 4; bi++) {
    var body = document.getElementById(id + '-' + bi);
    if (body) body.classList.toggle('open', bi === bandIdx);
  }
  var first = document.getElementById(id + '-0');
  if (first && first.parentElement) {
    var allTabs = first.parentElement.querySelectorAll('.pattern-tab');
    allTabs.forEach(function(tab, bi) {
      tab.className = 'pattern-tab' + (bi === bandIdx ? ' active-' + tabColors[bi] : '');
    });
  }
}

function toggleRefCard(id) {
  var body = document.getElementById(id);
  var chev = document.getElementById('chev-' + id);
  if (!body) return;
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  if (chev) chev.innerHTML = isOpen ? '&#9660;' : '&#9650;';
}

function renderConsolidatedNextSteps(responses, dimAvgBand) {
  var dimOrder = DIMS.map(function(d, i){ return i; })
    .sort(function(a,b){ return dimAvgBand[a] - dimAvgBand[b]; });

  var weakDims  = dimOrder.filter(function(i){ return dimAvgBand[i] < 2; });
  var midDims   = dimOrder.filter(function(i){ return dimAvgBand[i] >= 2 && dimAvgBand[i] < 3; });
  var strongDims = dimOrder.filter(function(i){ return dimAvgBand[i] >= 3; });

  function actionItem(dimIdx, urgency) {
    var avg = dimAvgBand[dimIdx];
    var bandKey = avg < 1 ? 'lag' : avg < 2 ? 'emg' : avg < 2.7 ? 'eff' : 'bic';
    var ta = TOP_ACTIONS.find(function(a){ return a.dim === dimIdx; });
    if (!ta) return '';
    return '<div class="action-item urgency-' + urgency + '">'
         + '<div class="action-dim-label">' + DIMS[dimIdx].short + '</div>'
         + '<div class="action-text">' + ta[bandKey] + '</div>'
         + '</div>';
  }

  var capCounts = {};
  CAPABILITIES.forEach(function(cap) {
    var noCount = responses.filter(function(r){
      return r.capabilities && r.capabilities[cap.id] === 'no';
    }).length;
    capCounts[cap.id] = noCount;
  });
  var missedCaps = CAPABILITIES
    .filter(function(c){ return capCounts[c.id] > 0; })
    .sort(function(a,b){ return capCounts[b.id] - capCounts[a.id]; })
    .slice(0,3);

  var urgentHtml = weakDims.length
    ? weakDims.map(function(i){ return actionItem(i,'high'); }).join('')
    : '<div style="font-size:12.5px;color:var(--slate);padding:8px">No dimensions in Lagging or Emerging across the group.</div>';

  var developHtml = midDims.length
    ? midDims.map(function(i){ return actionItem(i,'mid'); }).join('')
    : '';

  var strongHtml = strongDims.length
    ? strongDims.map(function(i){ return actionItem(i,''); }).join('')
    : '';

  var capHtml = '';
  if (missedCaps.length && responses.length > 0) {
    capHtml = '<div class="action-group">'
            + '<div class="action-group-title"><span style="color:#C0392B">&#9888;</span> Capability gaps — most commonly not produced</div>'
            + missedCaps.map(function(cap) {
                var n = capCounts[cap.id];
                var pct = Math.round(n/responses.length*100);
                var dimLabel = DIMS[cap.dim] ? DIMS[cap.dim].short : '';
                return '<div class="action-item urgency-high">'
                     + '<div class="action-dim-label">' + dimLabel + '</div>'
                     + '<div class="action-text"><strong>' + cap.label + '</strong>'
                     + ' — ' + n + ' of ' + responses.length + ' participants (' + pct + '%) cannot produce this. '
                     + 'This is a likely DD risk area: buyers routinely request this output and gaps create renegotiation risk.</div>'
                     + '</div>';
              }).join('')
            + '</div>';
  }

  return '<div class="enrich-section">'
       + '<div class="enrich-title">Consolidated group action plan</div>'
       + '<div class="enrich-sub">Priority actions derived from group scores, ranked by urgency. Red = Lagging or Emerging; purple = Effective but room to improve; teal = sustaining strength. Capability gaps flagged separately.</div>'
       + (weakDims.length ? '<div class="action-group"><div class="action-group-title"><span style="color:#C0392B">&#9650;</span> Urgent — address within 90 days</div>' + urgentHtml + '</div>' : '')
       + (midDims.length  ? '<div class="action-group"><div class="action-group-title"><span style="color:#8B7495">&#9654;</span> Develop — address within 6 months</div>' + developHtml + '</div>' : '')
       + (strongDims.length ? '<div class="action-group"><div class="action-group-title"><span style="color:var(--teal)">&#10003;</span> Sustain — maintain and prepare for exit</div>' + strongHtml + '</div>' : '')
       + capHtml
       + '</div>';
}

function renderGroupHeatmap(responses) {
  // Check if any response has capability data
  const hasCaps = responses.some(r => r.capabilities && Object.keys(r.capabilities).length > 0);
  if (!hasCaps) {
    return `<div style="background:var(--ow);border:1px solid var(--pearl);border-radius:2px;padding:14px;font-size:12.5px;color:var(--slate);text-align:center">No capability data submitted yet — participants need to complete the checklist questions on dimensions 5, 6, 7, 8 and 9.</div>`;
  }

  const dimOrder = [7, 8, 4, 6, 5];
  const dimLabels = { 7:'Data & Analytics', 8:'Business Partnering', 4:'Governance & Reporting', 6:'Cash & Working Capital', 5:'Exit Readiness' };
  const n = responses.length;

  // Build header row - one col per participant
  const pHeaders = responses.map((_,i) => `<th class="rotate"><span>P${i+1}</span></th>`).join('');
  var groupHeader = '<th style="text-align:center;min-width:70px;font-size:10px">Group<br><span style=\"font-weight:400;font-size:9px\">M=Monthly A=Ad-Hoc N=No</span></th>';

  let rows = '';
  dimOrder.forEach(dimIdx => {
    const caps = CAPABILITIES.filter(c => c.dim === dimIdx);
    if (!caps.length) return;
    const colspan = n + 2;
    rows += `<tr><td colspan="${colspan}" class="hm-dim-header"><span class="hm-dim-label">${dimLabels[dimIdx]}</span></td></tr>`;
    caps.forEach(cap => {
      var cells = responses.map(function(r) {
        var caps_data = r.capabilities || {};
        var val = caps_data[cap.id];
        if (val === 'monthly') return '<td class="hm-monthly">M</td>';
        if (val === 'adhoc')   return '<td class="hm-adhoc">A</td>';
        if (val === 'no')      return '<td class="hm-no">No</td>';
        return '<td style="text-align:center;color:#ccc;font-size:10px">\u2014</td>';
      }).join('');

      // Group summary — weighted score: monthly=2, adhoc=1, no=0
      var attempted = responses.filter(function(r){ return r.capabilities && r.capabilities[cap.id] !== undefined; });
      var totalScore = attempted.reduce(function(a,r){
        var v = r.capabilities[cap.id];
        return a + (v==='monthly'?2:v==='adhoc'?1:0);
      }, 0);
      var maxScore = attempted.length * 2;
      var pct = maxScore > 0 ? Math.round(totalScore/maxScore*100) : null;
      var mCount = attempted.filter(function(r){ return r.capabilities[cap.id]==='monthly'; }).length;
      var aCount = attempted.filter(function(r){ return r.capabilities[cap.id]==='adhoc'; }).length;
      var nCount = attempted.filter(function(r){ return r.capabilities[cap.id]==='no'; }).length;
      var grpBg = pct === null ? '' : pct>=70?'background:#118B8015':pct>=40?'background:#8B749515':'background:#C0392B15';
      var grpColor = pct === null ? '' : pct>=70?'color:#118B80':pct>=40?'color:#8B7495':'color:#C0392B';
      var grpCell = pct === null
        ? '<td style="text-align:center;color:#ccc">\u2014</td>'
        : '<td style="text-align:center;' + grpBg + '">'
          + '<div class="hm-grp-score" style="' + grpColor + '">' + pct + '%</div>'
          + '<div class="hm-grp-pct">' + mCount + 'M / ' + aCount + 'A / ' + nCount + 'N</div>'
          + '</td>';

      rows += `<tr><td class="hm-label" title="${cap.label}">${cap.label}</td>${cells}${grpCell}</tr>`;
    });
  });

  return `<div class="heatmap-wrap">
    <table class="heatmap">
      <thead>
        <tr>
          <th>Capability</th>
          ${pHeaders}
          ${groupHeader}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderFacilitator() {
  var sh=document.getElementById('shell');
  // Show loading state while fetching
  sh.innerHTML='<div class="card"><div style="text-align:center;padding:2rem;color:var(--slate)"><div style="font-size:24px;margin-bottom:10px">&#8635;</div>Loading responses...</div></div>';
  loadResponses().then(function(responses) {
    renderFacilitatorWithData(sh, responses);
  }).catch(function(e) {
    sh.innerHTML='<div class="card"><div style="color:#C0392B;padding:1rem">Error loading responses: '+e.message+'</div></div>';
  });
}

function renderFacilitatorWithData(sh, responses) {
  const n=responses.length;
  if(!n){sh.innerHTML=`<div class="card"><div class="section-title">Facilitator Dashboard</div><div class="section-rule"></div><div class="empty-state"><div style="font-size:32px;margin-bottom:10px">📊</div><div>No responses yet.</div><div style="font-size:12px;margin-top:6px">Ask participants to complete the assessment and click "Submit to group".</div></div><div style="margin-top:14px;text-align:center"><button class="btn" onclick="renderFacilitator()" style="font-size:12px">↺ Refresh</button></div></div>`;return;}

  // Compute modal band (most frequent) and average for each dim
  const dimModes=DIMS.map((_,d)=>{const counts=[0,0,0,0];responses.forEach(r=>{if(r.scores[d]!=null)counts[r.scores[d]]++;});const max=Math.max(...counts);return counts.indexOf(max);});
  const dimAvgBand=DIMS.map((_,d)=>{const vs=responses.map(r=>r.scores[d]).filter(v=>v!=null);return vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length):0;});
  const overallAvg=(dimAvgBand.reduce((a,b)=>a+b,0)/6);
  const overallBand=Math.round(overallAvg);

  const dists=DIMS.map((_,d)=>{const c=[0,0,0,0];responses.forEach(r=>{if(r.scores[d]!=null)c[r.scores[d]]++;});return c;});
  const weakIdx=dimAvgBand.indexOf(Math.min(...dimAvgBand));
  const strongIdx=dimAvgBand.indexOf(Math.max(...dimAvgBand));
  const spread=dists[weakIdx].filter(c=>c>0).length>2;
  const lagCount=dists[weakIdx][0]+dists[weakIdx][1];

  // Chart builder with summary panel
  const distHtml=DIMS.map((d,di)=>{
    const counts=dists[di];
    const rawMax=Math.max(...counts,0);
    const yMax=rawMax+1;
    const chartH=100,leftPad=30,topPad=14,bottomPad=28;
    const vbBarW=52,vbGap=20;
    const chartInnerW=4*(vbBarW+vbGap)-vbGap; // 4 bars for 4 bands
    const totalVbW=leftPad+chartInnerW+10;
    const totalVbH=topPad+chartH+bottomPad;
    const ticks=Array.from({length:yMax+1},(_,i)=>i);
    const gridLines=ticks.map(val=>{const y=topPad+chartH-Math.round((val/yMax)*chartH);return`<line x1="${leftPad-6}" y1="${y}" x2="${leftPad+chartInnerW+6}" y2="${y}" stroke="#E4DEE0" stroke-width="1"/><text x="${leftPad-9}" y="${y+4}" text-anchor="end" font-size="10" fill="#9192AB" font-family="Arial,sans-serif">${val}</text>`;}).join('');
    const svgBars=counts.map((c,j)=>{const barH=c>0?Math.max(4,Math.round((c/yMax)*chartH)):0;const x=leftPad+j*(vbBarW+vbGap);const y=topPad+chartH-barH;return`${barH>0?`<rect x="${x}" y="${y}" width="${vbBarW}" height="${barH}" rx="2" fill="${BAND_COLORS[j]}"/>`:''}${c>0?`<text x="${x+vbBarW/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0C44" font-family="Arial,sans-serif">${c}</text>`:''}<text x="${x+vbBarW/2}" y="${topPad+chartH+18}" text-anchor="middle" font-size="10" fill="#9192AB" font-family="Arial,sans-serif">${BAND_SHORT[j]}</text>`;}).join('');
    const ac=BAND_COLORS[Math.round(dimAvgBand[di])];
    const total=counts.reduce((a,b)=>a+b,0);
    const pct=v=>total>0?Math.round(v/total*100):0;
    const lagEm=counts[0]+counts[1],eff=counts[2],bic=counts[3];
    const interp=dimAvgBand[di]>=2.5?'Group broadly at PE-standard on this dimension.':dimAvgBand[di]>=1.5?'Functional but investment needed to reach Effective.':'Significant gaps — this dimension needs urgent prioritisation.';
    const summaryPanel=`<div style="background:var(--ow);border:1px solid var(--pearl);border-radius:2px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;justify-content:center;">
      <div style="font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:0.5px">Group snapshot</div>
      <div style="display:flex;align-items:baseline;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--pearl)">
        <div style="font-size:22px;font-weight:700;color:${ac};line-height:1">${BAND_NAMES[Math.round(dimAvgBand[di])]}</div>
        <div style="font-size:11px;color:var(--slate)">modal · ${total} resp.</div>
      </div>
      ${[{label:'Lagging–Emerging',count:lagEm,color:BAND_COLORS[0]},{label:'Effective',count:eff,color:BAND_COLORS[2]},{label:'Best-in-Class',count:bic,color:BAND_COLORS[3]}].map(b=>`<div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <div style="font-size:11px;color:var(--steel)">${b.label}</div>
          <div style="font-size:11px;font-weight:700;color:${b.color}">${b.count} <span style="font-weight:400;color:var(--slate)">(${pct(b.count)}%)</span></div>
        </div>
        <div style="height:4px;background:var(--pearl);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct(b.count)}%;background:${b.color};border-radius:2px"></div></div>
      </div>`).join('')}
      <div style="font-size:11.5px;color:var(--steel);line-height:1.45;padding-top:4px;border-top:1px solid var(--pearl);font-style:italic">${interp}</div>
    </div>`;

    // KPI benchmarks for this dimension
    const kpiData=BENCHMARKS_KPI.find(b=>b.dim===d.label);
    const kpiHtml=kpiData?`<div style="margin-top:10px">
      <div style="font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">KPI benchmarks</div>
      <table class="benchmark-table">
        <thead><tr><th>KPI</th><th>Effective</th><th>Best-in-Class</th><th>Note</th></tr></thead>
        <tbody>${kpiData.kpis.map(k=>`<tr><td class="bm-kpi">${k.kpi}</td><td class="bm-eff">${k.eff}</td><td class="bm-bic">${k.bic}</td><td>${k.note}</td></tr>`).join('')}</tbody>
      </table>
    </div>`:'';

    // Benchmark text examples
    const bm=BENCHMARKS[di];
    const bmHtml=`<div style="margin-top:12px">
      <div style="font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">What each band looks like in practice</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
        ${[bm.low,bm.mid,bm.high,bm.bic].map((b,bi)=>`<div style="border:1px solid ${BAND_COLORS[bi]}28;border-left:3px solid ${BAND_COLORS[bi]};border-radius:2px;padding:9px 11px;background:${BAND_COLORS[bi]}06">
          <div style="font-size:9px;font-weight:700;color:${BAND_COLORS[bi]};text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">${b.label}</div>
          ${b.points.map(p=>`<div style="display:flex;gap:5px;align-items:flex-start;margin-bottom:4px"><div style="width:4px;height:4px;border-radius:50%;background:${BAND_COLORS[bi]};flex-shrink:0;margin-top:4px"></div><div style="font-size:11px;color:#465576;line-height:1.4">${p}</div></div>`).join('')}
        </div>`).join('')}
      </div>
    </div>`;

    // Org charts for dim 0 only
    const orgHtml = di===0 ? renderOrgCharts() : '';

    return`<div class="dim-section">
      <div class="dim-section-title">${d.label}
        <span class="dim-avg-pill" style="color:${ac};border-color:${ac}22;background:${ac}10">${BAND_NAMES[Math.round(dimAvgBand[di])]}</span>
        <span style="font-size:10px;font-weight:400;color:var(--slate)">${d.compass}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start;margin-bottom:14px">
        <div style="width:100%">
          <svg viewBox="0 0 ${totalVbW} ${totalVbH}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto">
            ${gridLines}
            <line x1="${leftPad-6}" y1="${topPad}" x2="${leftPad-6}" y2="${topPad+chartH}" stroke="#E4DEE0" stroke-width="1"/>
            <line x1="${leftPad-6}" y1="${topPad+chartH}" x2="${leftPad+chartInnerW+6}" y2="${topPad+chartH}" stroke="#E4DEE0" stroke-width="1"/>
            ${svgBars}
          </svg>
        </div>
        ${summaryPanel}
      </div>
      ${kpiHtml}
      ${bmHtml}
      ${orgHtml}
    </div>`;
  }).join('');

  // Group foundations
  const groupBands=DIMS.map((_,d)=>{const vs=responses.map(r=>r.scores[d]).filter(v=>v!=null);return vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):null;});
  const groupFoundations=renderFoundations(groupBands);

  // Profile cards
  const profileHtml=responses.map((r,i)=>{
    const vs=r.scores;
    const avgB=Math.round(vs.filter(v=>v!=null).reduce((a,b)=>a+b,0)/vs.filter(v=>v!=null).length||0);
    return`<div class="profile-card"><div class="profile-id">Participant ${r.id}</div>${DIMS.map((d,di)=>{const v=vs[di];return`<div class="profile-row"><div class="profile-dim" title="${d.label}">${d.short}</div><div class="profile-bar-track"><div class="profile-bar-fill" style="width:${v==null?0:(v+1)/4*100}%;background:${bandColor(v)}"></div></div><div class="profile-band" style="color:${bandColor(v)}">${v==null?'—':BAND_SHORT[v]}</div></div>`;}).join('')}<div class="profile-avg" style="color:${BAND_COLORS[avgB]}">${BAND_NAMES[avgB]}</div></div>`;
  }).join('');

  // Discussion prompts
  const prompts=[
    `<strong>${DIMS[weakIdx].label}</strong> is the group's weakest dimension — ${lagCount>0?`${lagCount} participant${lagCount>1?'s':''} rated themselves Lagging or Emerging. `:''}What is the single biggest structural barrier holding this area back?`,
    spread?`There is a wide spread of bands on <strong>${DIMS[weakIdx].label}</strong>. What explains the gap between those at Effective/BIC and those at Lagging/Emerging?`:`<strong>${DIMS[strongIdx].label}</strong> is the group's strongest area. Is that strength sustainable through a buy-and-build or pre-exit period?`,
    `Looking at Cash & Working Capital — how many of you are running cash as a genuine strategic lever vs. just reporting it? What would it take to change that?`,
    `On Business Partnering — is finance in the room when commercial decisions get made, or does it find out afterwards? What is the single change that would shift that dynamic?`,
    `On Data Quality — how many of you have a KPI that means something different in finance vs. in the business? That gap is also an exit risk: buyers will find the inconsistency.`,
    `If you had to move one dimension from Lagging/Emerging to Effective in the next 90 days, which would it be — and what is the single first action?`,
    `Looking at the Value Foundations overlay — is the weakness structural (People, Process) or operational (Technology, Data)? How does that change your prioritisation?`,
  ];

  sh.innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">
      <div class="section-title">Facilitator Dashboard</div>
      ${SUPABASE_URL === 'YOUR_SUPABASE_URL' ? '<div style=\"background:#FFF3CD;border:1px solid #FBBF24;border-radius:2px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#92400E\"><strong>&#9888; Running in offline mode</strong> — responses stored locally only.</div>' : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" onclick="renderFacilitator()" style="font-size:11px;padding:6px 12px">↺ Refresh</button>
        <span id="live-indicator" style="font-size:10px;color:var(--teal);font-weight:700;padding:4px 8px;background:#e6f4f1;border-radius:2px;border:1px solid var(--teal)">● Live</span>
        <button class="btn" onclick="showQR()" style="font-size:11px;padding:6px 12px;background:var(--teal);color:#fff;border-color:var(--teal)">QR Code</button>
        <button class="btn" onclick="if(confirm('Clear all responses?')){clearResponses().then(function(){renderFacilitator();});}" style="font-size:11px;padding:6px 12px;color:#C0392B;border-color:#C0392B">Clear all</button>
      </div>
    </div>
    <div class="section-rule"></div>
    <div class="dash-grid">
      <div class="dash-stat"><div class="dash-stat-label">Participants</div><div class="dash-stat-val">${n}</div><div class="dash-stat-sub">responses submitted</div></div>
      <div class="dash-stat"><div class="dash-stat-label">Group rating</div><div class="dash-stat-val" style="font-size:16px;padding-top:4px;color:${BAND_COLORS[overallBand]}">${BAND_NAMES[overallBand]}</div><div class="dash-stat-sub">overall modal band</div></div>
      <div class="dash-stat"><div class="dash-stat-label">Biggest gap</div><div class="dash-stat-val" style="font-size:14px;padding-top:4px">${DIMS[weakIdx].short}</div><div class="dash-stat-sub">${BAND_NAMES[Math.round(dimAvgBand[weakIdx])]} avg</div></div>
    </div>
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px">Score distributions by dimension</div>
    ${distHtml}
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px">Group average radar</div>
    <div class="radar-wrap" style="max-width:320px;margin:0 auto 1.3rem">${drawRadar(groupBands,280,'#006C80')}</div>
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">Group value foundations</div>
    <div style="font-size:12px;color:var(--slate);margin-bottom:10px">Derived from group average scores — where are the structural gaps?</div>
    ${groupFoundations}
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">Group capability heat map</div>
    <div style="font-size:12px;color:var(--slate);margin-bottom:10px">Ticks show which capabilities each participant confirmed they can produce. Gaps highlighted in red are likely DD risk areas.</div>
    ${renderGroupHeatmap(responses)}
    <div class="sep"></div>
    ${renderConsolidatedNextSteps(responses, dimAvgBand)}
    <div class="sep"></div>
    ${renderReferenceCards()}
    <div class="sep"></div>
    ${renderFailurePatterns(dimAvgBand)}
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">Individual profiles <span style="font-size:11px;font-weight:400;color:var(--slate)">(anonymised)</span></div>
    <div class="profiles-grid" style="margin-bottom:1.2rem">${profileHtml}</div>
    <div class="sep"></div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">Discussion prompts</div>
    ${prompts.map((p,i)=>`<div class="prompt-row"><div class="prompt-num">${i+1}</div><div class="prompt-text">${p}</div></div>`).join('')}
    <div style="margin-top:1.2rem;display:flex;gap:8px;flex-wrap:wrap">
      <button class="print-btn" onclick="window.print()">🖨 Print dashboard</button>
      <button class="print-btn" onclick="exportToExcel()" style="background:var(--emerald);color:#fff;border-color:var(--emerald)">⬇ Export to Excel</button>
    </div>
  </div>`;
}

  function arr(x1,y1,x2,y2,col){return`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.2" marker-end="url(#arr-${col.replace('#','')})"/>`;}

  function defs(cols){return`<defs>${cols.map(c=>`<marker id="arr-${c.replace('#','')}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="${c}"/></marker>`).join('')}</defs>`;}
  const NV='#0B0C44',TL='#006C80',EM='#118B80',SP='#8B7495',RD='#C0392B',OW='#F1EFF0',PL='#E4DEE0';

  const c1=`<svg viewBox="0 0 480 290" style="width:100%;height:auto;display:block">

    ${node(30,110,120,30,'Acting FC / Mgmt Acct','Covering FC duties','#88395A','#fff','#88395A')}
    ${node(180,110,120,30,'Bookkeeper / AP','Transactions only','#888','#fff','#888')}
    ${node(330,110,120,30,'No FP&A resource','CFO covers ad hoc','#aaa','#fff','#aaa')}
    <text x="10" y="162" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">SYSTEMS (FRAGMENTED)</text>
    ${pill(10,169,72,'Sage/Xero',PL,'#465576')}${pill(90,169,72,'Excel budget',PL,'#465576')}${pill(170,169,80,'Excel board pack',PL,'#465576')}${pill(258,169,68,'Payroll sw.',PL,'#465576')}${pill(334,169,68,'CRM unused',PL,'#465576')}
    <text x="10" y="207" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">EXTERNAL — Late board packs; no business partnering; reactive auditors</text>
    <text x="10" y="225" font-size="8" fill="${RD}" font-family="Arial,sans-serif">PE Board: late, revised packs &nbsp;|&nbsp; Ops: requests direct to CFO &nbsp;|&nbsp; Auditor: reactive; year-end surprises common</text>
    <text x="10" y="245" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">DATA: Siloed · no single version of truth · reconciliation manual and error-prone</text>
  </svg>`;

  const c2=`<svg viewBox="0 0 480 310" style="width:100%;height:auto;display:block">

    <rect width="480" height="310" rx="4" fill="${OW}" stroke="${PL}" stroke-width="1"/>

    ${arr(105,118,62,148,SP)}${arr(105,118,147,148,SP)}
    ${node(310,148,100,26,'No FP&A support','Single pt of failure','#aaa','#fff','#aaa')}
    <text x="10" y="195" font-size="8" font-weight="700" fill="#9192AB" font-family="Arial,sans-serif">SYSTEMS</text>
    ${pill(10,202,90,'NetSuite/BC (ERP)',TL+'20',TL)}${pill(108,202,80,'Excel (FP&A)',PL,'#465576')}${pill(196,202,75,'PPT packs',PL,'#465576')}${pill(279,202,75,'Salesforce CRM',PL,'#465576')}${pill(362,202,80,'Payroll (out)',TL+'20',TL)}

    <rect width="480" height="330" rx="4" fill="${OW}" stroke="${PL}" stroke-width="1"/>

    ${node(5,136,80,24,'Mgmt Acct ×2','Close·recon',TL+'50','#006C80',TL)}
    ${node(92,136,72,24,'AP/AR','Outsourced MSP',TL+'30','#006C80',TL)}
    ${arr(90,110,45,136,TL)}${arr(90,110,128,136,TL)}
    ${node(300,136,90,24,'FP&A Analyst ×2','Forecast·variance',EM+'50','#118B80',EM)}
    ${node(398,136,74,24,'Biz Partner ×1','Ops partnering',EM+'50','#118B80',EM)}
